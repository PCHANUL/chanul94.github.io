/* ═══ [§scr.map] 지도 렌더 ═══ */
function laneTop(name){ return NODE_Y[DUNGEONS[name].turns] + NODE_H; }

/* 토큰이 쉬어 가는 지점 — 이정표가 서는 자리 */
function stepY(turns, elapsed){
  const inside = NODE_Y[turns] + NODE_H/2 - 16;
  const start  = SHOP_Y - 34;
  return start - Math.min(1, elapsed/turns) * (start - inside);
}

/* ═══ 지형 배경 — 한 번만 그린다 ═══
   위로 갈수록 암반이 촘촘해지고 어두워진다. 상태 정보는 담지 않는다. */
function buildBackdrop(){
  const W = 390, H = MAP_H, rand = mulberry32(20260808);
  let g = '';

  // 암반 층리 — 위(깊은 곳)일수록 진하고 촘촘하게
  const rows = 30;
  for(let i=0;i<rows;i++){
    const t = i/rows;
    const y = 26 + t*(H-90) + rand()*12;
    let d = `M0,${y.toFixed(1)}`;
    for(let x=48;x<=W;x+=48){
      d += ` Q${(x-24)},${(y + rand()*11-5.5).toFixed(1)} ${x},${(y + rand()*9-4.5).toFixed(1)}`;
    }
    const op = (0.20 * (1-t) + 0.03).toFixed(3);
    g += `<path d="${d}" stroke="#463b31" stroke-width="${(0.8+rand()*1.3).toFixed(1)}" fill="none" opacity="${op}"/>`;
  }

  // 바위 알갱이
  for(let i=0;i<110;i++){
    const y = rand()*H, x = rand()*W, t = 1 - y/H;
    g += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(0.6+rand()*1.5).toFixed(1)}"
           fill="#554839" opacity="${(0.05 + t*0.13).toFixed(3)}"/>`;
  }

  // 길 — 던전에서 상점까지. 곧게가 아니라 굽어서 내려온다.
  Object.entries(DUNGEONS).forEach(([name, D])=>{
    if(!D.unlocked) return;
    const x = LANE_X[D.lane];
    const top = NODE_Y[D.turns] + NODE_H - 4;
    const bot = SHOP_Y - 2;
    const r2 = mulberry32(seedOf(name));
    let d = `M${x},${bot}`;
    const segs = Math.max(3, Math.round((bot-top)/95));
    for(let i=1;i<=segs;i++){
      const yy = bot - (bot-top)*(i/segs);
      const amp = 9 * Math.sin(i*1.7 + r2()*2);
      d += ` Q${(x+amp*1.5).toFixed(0)},${(yy + (bot-top)/segs/2).toFixed(0)} ${(x+amp*0.35).toFixed(0)},${yy.toFixed(0)}`;
    }
    // 길바닥 — 두껍고 어둡게 깔고, 그 위에 파선
    g += `<path d="${d}" stroke="#2c251f" stroke-width="13" fill="none" stroke-linecap="round" opacity=".55"/>`;
    g += `<path d="${d}" stroke="${D.accent}" stroke-width="1.3" fill="none"
           stroke-dasharray="3 8" stroke-linecap="round" opacity=".26"/>`;
    // 길가 자갈
    for(let i=0;i<16;i++){
      const yy = bot - (bot-top)*r2();
      const off = (r2()<.5?-1:1) * (9 + r2()*8);
      g += `<circle cx="${(x+off).toFixed(0)}" cy="${yy.toFixed(0)}" r="${(0.9+r2()*1.4).toFixed(1)}"
             fill="#5b4d3d" opacity="${(0.16+r2()*0.2).toFixed(2)}"/>`;
    }
  });

  // 상점 앞 지반선
  g += `<path d="M12,${SHOP_Y-1} H378" stroke="#5c5142" stroke-width="1" opacity=".5"/>`;
  g += `<rect x="0" y="${SHOP_Y}" width="${W}" height="${H-SHOP_Y}" fill="#0e0b09" opacity=".45"/>`;

  return `<svg class="backdrop" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

function renderMap(){
  const inner = $('mapInner');
  inner.style.height = MAP_H + 'px';
  inner.querySelectorAll('.backdrop,.dnode,.rumor,.tick,.milestone,.mist,.ember').forEach(el=>el.remove());
  $('shopBar').style.top = SHOP_Y + 'px';

  inner.insertAdjacentHTML('afterbegin', buildBackdrop());

  // 깊은 곳의 안개
  [140, 330, 560].forEach((y,k)=>{
    const m = document.createElement('div');
    m.className = 'mist'; m.style.top = y+'px';
    m.style.animationDelay = (k*-7)+'s';
    inner.appendChild(m);
  });

  // 깊이 눈금 — 해금 여부와 무관하게 축 자체를 보여준다
  [1,2,3].forEach(t=>{
    const tk = document.createElement('div');
    tk.className = 'tick';
    tk.style.top = (NODE_Y[t] + NODE_H + 14) + 'px';
    tk.textContent = dayWord(t);
    inner.appendChild(tk);
  });

  Object.entries(DUNGEONS).forEach(([name, D])=>{
    if(!D.unlocked){
      if(D.rumored){
        const r = document.createElement('div');
        r.className = 'rumor on';
        r.style.left = (LANE_X[D.lane]-59) + 'px';
        r.innerHTML = `${dungeonName(name)}<small>소문뿐</small>`;
        inner.appendChild(r);
      }
      return;
    }
    const top = NODE_Y[D.turns];

    // 이정표 — 하루치가 어디서 끊기는지 길 위에 새겨둔다
    for(let i=1;i<D.turns;i++){
      const ms = document.createElement('div');
      ms.className = 'milestone';
      ms.style.left = (LANE_X[D.lane] + 15) + 'px';
      ms.style.top  = (stepY(D.turns, i) + 6) + 'px';
      ms.innerHTML = MILESTONE;
      inner.appendChild(ms);
    }

    // 화룡 소굴 — 입구에서 잔불이 올라온다
    if(name === '화룡 소굴'){
      for(let i=0;i<4;i++){
        const e = document.createElement('div');
        e.className = 'ember';
        e.style.left = (LANE_X[D.lane] - 14 + i*9) + 'px';
        e.style.top  = (top + NODE_H - 6) + 'px';
        e.style.animationDelay = (i*1.35)+'s';
        inner.appendChild(e);
      }
    }

    const n = document.createElement('div');
    n.className = 'dnode' + (D.justUnlocked ? ' new' : '');
    D.justUnlocked = false;
    n.style.left = LANE_X[D.lane] + 'px';
    n.style.top  = top + 'px';
    n.dataset.name = name;
    n.style.setProperty('--accent', D.accent);
    const kws = D.keys.filter(k=>D.known.has(k));
    const logLine = kws.length
      ? kws.slice(0,3).join(' · ')
      : '아직 아무도 보내지 않았다';
    const keyHTML = D.keys.map(k=>
      D.known.has(k) ? `<span class="key">${k}</span>` : `<span class="key key--q">?</span>`).join('');
    const lootHTML = D.loot.map(l=>
      D.lootKnown.has(l) ? `<span class="loot">${l}</span>` : `<span class="loot loot--q">?</span>`).join('');
    const rumors = D.log.slice().reverse();

/* ═══ [§scr.dfocus] 던전 카드를 가운데로 불러내기 ═══
   지도에서 카드를 탭하면, 같은 카드를 dfocus 층에서 다시 그려
   원래 자리 위치에서 시작해 화면 가운데로 이동하며 동시에 뒤집는다.
   .dnode.flipped 의 width/rotateY 전환을 그대로 재사용한다.       */
let DFOCUS = null;   // { node, clone, dx, dy }

function openDnodeFocus(node, name){
  if(DFOCUS) return;
  const df = $('dfocus');
  const dfR = df.getBoundingClientRect();
  const nr  = node.getBoundingClientRect();

  const clone = node.cloneNode(true);
  clone.classList.remove('new');
  clone.classList.add('dfocus-card');
  clone.removeAttribute('style');

  // 원래 자리와 가운데 사이의 거리 — 여기서 시작해 0으로 좁혀지며 이동한다
  const dx = (nr.left + nr.width/2) - (dfR.left + dfR.width/2);
  const dy = (nr.top  + nr.height/2) - (dfR.top  + dfR.height/2);
  clone.style.width = nr.width + 'px';
  clone.style.transition = 'none';
  clone.style.transform = `translate(-50%,-50%) translate(${dx}px, ${dy}px)`;

  df.innerHTML = ''; df.appendChild(clone);
  df.classList.add('on');
  node.style.visibility = 'hidden';   // 원래 카드는 숨겨 중복을 막는다
  DFOCUS = { node, clone, dx, dy };

  void clone.offsetWidth;   // 강제 리플로우 — 시작 위치가 실제로 반영되게
  requestAnimationFrame(()=>{
    clone.style.transition = '';
    clone.style.transform = 'translate(-50%,-50%)';
    clone.classList.add('flipped');   // 이동과 동시에 뒤집힌다
  });
}

function closeDnodeFocus(){
  if(!DFOCUS) return;
  const { node, clone, dx, dy } = DFOCUS;
  clone.classList.remove('flipped');
  clone.style.transform = `translate(-50%,-50%) translate(${dx}px, ${dy}px)`;
  setTimeout(()=>{
    $('dfocus').classList.remove('on');
    $('dfocus').innerHTML = '';
    node.style.visibility = '';
    DFOCUS = null;
  }, 520);
}
$('dfocus').addEventListener('click', e=>{ if(e.target.id === 'dfocus') closeDnodeFocus(); });

/* ── 스크롤 제어 ── */
function scrollToY(y, smooth=true){
  const m = $('map');
  const target = Math.max(0, Math.min(MAP_H - m.clientHeight, y - m.clientHeight/2));
  m.scrollTo({ top:target, behavior: smooth ? 'smooth' : 'auto' });
}
function scrollToShop(smooth=true){
  const m = $('map');
  m.scrollTo({ top: MAP_H - m.clientHeight, behavior: smooth ? 'smooth' : 'auto' });
}
function updateHint(){
  const m = $('map'), h = $('scrollHint');
  const deepest = S.out.reduce((a,o)=>Math.min(a, tokenY(o)), Infinity);
  const hasAbove = m.scrollTop > 24;
  h.classList.toggle('on', hasAbove === false && deepest < m.scrollTop + 40);
}
$('map').addEventListener('scroll', ()=>{ $('scrollHint').classList.remove('on'); }, { passive:true });

/* 토큰 위치
   elapsed 0      → 상점을 막 벗어난 지점
   elapsed turns  → 던전 카드 한가운데 (= 안으로 들어간 상태) */
function tokenY(o){
  const D = DUNGEONS[o.dungeon];
  const inside = NODE_Y[D.turns] + NODE_H/2 - 16;   // 던전 카드 속
  const start  = SHOP_Y - 34;
  const p = Math.min(1, o.elapsed / D.turns);
  return start - p * (start - inside);
}

function renderTokens(){
  const inner = $('mapInner');
  S.out.forEach(o=>{
    let el = document.getElementById('tok-'+o.id);
    if(!el){
      el = document.createElement('div');
      el.className = 'token'; el.id = 'tok-'+o.id;
      el.style.setProperty('--accent', GRADE[o.weapon.grade].c);
      el.innerHTML = `<div class="token__glyph">${WSIL[o.weapon.type]}</div>
                      <div class="token__step">${o.elapsed}/${DUNGEONS[o.dungeon].turns}</div>`;
      inner.appendChild(el);
    }
    el.querySelector('.token__step').textContent = `${o.elapsed}/${DUNGEONS[o.dungeon].turns}`;
    el.style.left = LANE_X[DUNGEONS[o.dungeon].lane] + 'px';
    el.style.top  = tokenY(o) + 'px';
  });
}

function forgeGrade(selection){
  const score = selection.reduce((sum,n)=>sum+(MATERIALS[n]?.tier||1),0);
  return score >= 8 ? 'unique' : score >= 6 ? 'high' : score >= 4 ? 'mid' : 'common';
}

function renderForgePopup(){
  const panel = $('forgePopupPanel');
  const names = Object.keys(S.mats).filter(n=>S.mats[n] > 0);
  const slots = Array.from({length:MATS_PER_WEAPON},(_,i)=>{
    const n = forgeSelection[i];
    if(!n) return `<div class="forge-slot"><span class="forge-slot__num">${i+1}</span><span class="forge-slot__name">재료 선택</span></div>`;
    const M = MATERIALS[n] || { c:'var(--ink-dim)', tier:1 };
    return `<button class="forge-slot filled" data-slot="${i}" style="--mc:${M.c}" title="선택 취소">
      <span class="forge-slot__gem tier${M.tier}"></span><span class="forge-slot__name">${n}</span>
    </button>`;
  }).join('');

  panel.innerHTML = `
    <div class="forge-popup__head">
      <span class="forge-popup__ico">${ICON.anvil}</span>
      <div><div class="forge-popup__title">제작소</div><div class="forge-popup__sub">재료를 3개 골라 모루 위에 올린다.</div></div>
      <button class="forge-popup__close" id="forgeClose" aria-label="닫기">×</button>
    </div>
    <div class="forge-slots">${slots}</div>
    <div class="forge-popup__k">보 유 재 료</div>
    <div class="forge-materials">${names.map(n=>{
      const M = MATERIALS[n] || { c:'var(--ink-dim)', tier:1 };
      const picked = selectedMatCount(n), left = S.mats[n]-picked;
      return `<button class="forge-mat${picked?' selected':''}${left<=0?' exhausted':''}" data-mat="${n}" style="--mc:${M.c}">
        <span class="forge-mat__gem tier${M.tier}"></span>
        <span class="forge-mat__txt"><span class="forge-mat__name">${n}</span><span class="forge-mat__left">남음 ${left} / ${S.mats[n]}</span></span>
        ${picked ? `<span class="forge-mat__picked">${picked}</span>` : ''}
      </button>`;
    }).join('')}</div>
    <div class="forge-popup__foot">
      <button class="forge-start" id="forgeStart" ${forgeSelection.length===MATS_PER_WEAPON?'':'disabled'}>벼리기</button>
      <div class="forge-start__note">${forgeSelection.length} / ${MATS_PER_WEAPON} 선택</div>
    </div>`;

  $('forgeClose').onclick = closeForgePopup;
  panel.querySelectorAll('.forge-slot[data-slot]').forEach(el=>{
    el.onclick = ()=>{ forgeSelection.splice(Number(el.dataset.slot),1); renderForgePopup(); };
  });
  panel.querySelectorAll('.forge-mat[data-mat]').forEach(el=>{
    el.onclick = ()=>{
      if(forgeSelection.length >= MATS_PER_WEAPON) return;
      const n = el.dataset.mat;
      if(selectedMatCount(n) >= (S.mats[n]||0)) return;
      forgeSelection.push(n); renderForgePopup();
    };
  });
  $('forgeStart').onclick = startForging;
}

function openForgePopup(){
  if(totalMats() < MATS_PER_WEAPON) return;
  forgeSelection = [];
  renderForgePopup();
  $('forgePopup').classList.add('on');
}

function closeForgePopup(){
  $('forgePopup').classList.remove('on');
  forgeSelection = [];
}

function startForging(){
  if(forgeSelection.length !== MATS_PER_WEAPON) return;
  const used = [...forgeSelection];
  const counts = used.reduce((acc,n)=>{ acc[n]=(acc[n]||0)+1; return acc; },{});
  const available = Object.entries(counts).every(([n,c])=>c <= (S.mats[n]||0));
  if(!available){ closeForgePopup(); renderPanel(); return; }
  used.forEach(n=>{
    S.mats[n]--;
    if(S.mats[n] <= 0) delete S.mats[n];
  });
  S.stock.push(makeWeapon(forgeGrade(used)));
  $('forgePopup').classList.remove('on');
  forgeSelection = [];
  toast(`${used.join(' · ')}으로 한 자루를 벼렸다.`);
  renderPanel();
}

/* ═══════════ [§scr.seq] 지도 시퀀스 ═══════════
   §5  파견(느리게) → 진행(툭툭) → 귀환(빠르게) → 정적
   지도는 "몇 장이 돌아왔는가"까지만 말하고 입을 다문다.        */
let outId = 0;
const TOKEN_MOTION = {
  stagger:190,
  dispatch:780,
  step:380,
  arrive:540,
  jump:330
};
function runSequence(){
  S.phase = 'seq'; renderPanel();
  setPanel(true);                        // 시퀀스 동안은 지도가 화면 전부를 쓴다

  // ① 파견 — 접객에서 건넨 것들
  const dispatched = [];
  S.pending.forEach(pd=>{
    const D = DUNGEONS[pd.dungeon];
    const o = {
      id:'o'+(++outId), hero:pd.hero, weapon:pd.weapon, dungeon:pd.dungeon,
      dispatchDay:S.day, elapsed:0,
      react: pd.react, said: pd.said,
      outcome: rollOutcome(pd.hero, pd.weapon, pd.dungeon)   // 지금 확정. 뜯기 전까지 아무도 모른다.
    };
    D.sent++;
    S.out.push(o); dispatched.push(o);
  });
  S.pending = []; S.guests = [];


  // 파견은 상점에서 시작한다 — 시선을 아래에 고정
  setTimeout(scrollToShop, 420);

  // 새 토큰을 상점 위치에서 만든 뒤 자리로 올려보낸다
  dispatched.forEach((o,k)=>{
    const el = document.createElement('div');
    el.className='token'; el.id='tok-'+o.id;
    el.style.setProperty('--accent', GRADE[o.weapon.grade].c);
    el.style.left = LANE_X[DUNGEONS[o.dungeon].lane]+'px';
    el.style.top  = SHOP_Y+'px'; el.style.opacity='0';
    el.style.transition = `top ${TOKEN_MOTION.dispatch}ms cubic-bezier(.4,.15,.2,1), opacity .36s`;
    el.innerHTML = `<div class="token__glyph">${WSIL[o.weapon.type]}</div>
                    <div class="token__step">0/${DUNGEONS[o.dungeon].turns}</div>`;
    $('mapInner').appendChild(el);
    setTimeout(()=>{ el.style.opacity='1'; el.style.top = tokenY(o)+'px'; }, 420 + k*TOKEN_MOTION.stagger);
  });

  const dispatchTime = dispatched.length ? 1350 + dispatched.length*TOKEN_MOTION.stagger : 420;

  // 문을 연 순간 하루가 흘렀다. 곧바로 다음 날이 온다.
  setTimeout(nextDay, dispatchTime + 700);
}

/* ═══════════ [§scr.arrival] 아침 시퀀스 ═══════════
   ② 진행 — 나가 있던 것들이 한 칸씩 툭
   ③ 귀환 — 도착분이 내려온다. 뒤집힌 채, 나간 수만큼.
   ④ 정적 → 개봉                                            */
function runArrival(){
  S.phase = 'seq'; renderPanel(); setPanel(true);

  if(!S.out.length){ setTimeout(openShop, 420); return; }

  setTimeout(()=>{
    const moving = S.out.slice();
    moving.forEach((o,k)=>{
      setTimeout(()=>{
        o.elapsed++;
        const D = DUNGEONS[o.dungeon];
        const el = document.getElementById('tok-'+o.id);
        if(!el) return;
        const arrived = o.elapsed >= D.turns;
        scrollToY(tokenY(o));                     // 움직이는 것을 따라간다
        el.style.transition = arrived
          ? `top ${TOKEN_MOTION.arrive}ms cubic-bezier(.4,.15,.2,1)`  // 던전으로 빨려 들어가듯
          : `top ${TOKEN_MOTION.step}ms cubic-bezier(.34,1.25,.64,1)`;
        el.classList.add('jump');
        el.querySelector('.token__step').textContent = `${o.elapsed}/${D.turns}`;
        el.style.top = tokenY(o) + 'px';          // 도착 턴에는 던전 카드 안까지 간다
        setTimeout(()=>el.classList.remove('jump'), TOKEN_MOTION.jump);
        if(arrived){
          setTimeout(()=>{
            el.classList.add('inside');
            const node = [...document.querySelectorAll('.dnode')]
              .find(n=>n.dataset.name===o.dungeon);
            if(node){ node.classList.add('swallow'); setTimeout(()=>node.classList.remove('swallow'),1150); }
          }, 380);
        }
      }, k*TOKEN_MOTION.stagger);
    });
    const advanceTime = moving.length*TOKEN_MOTION.stagger + 720;

    setTimeout(()=>{
      const arriving = S.out.filter(o=>o.elapsed >= DUNGEONS[o.dungeon].turns);
      S.out = S.out.filter(o=>o.elapsed < DUNGEONS[o.dungeon].turns);

      if(!arriving.length){ setTimeout(openShop, 300); return; }

      // ③ 던전 안에 잠시 머문 뒤, 봉투가 실제로 모두 도착할 때까지 기다린다.
      setTimeout(()=>returnAllEnvelopes(arriving), 950);
    }, advanceTime);
  }, 500);
}

function waitMs(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }

function prepareReturnStatus(total){
  const status = $('returnStatus');
  status.classList.remove('complete');
  $('returnStack').innerHTML = '';
  $('returnLabel').textContent = `결과 봉투 0 / ${total}`;
  status.classList.add('on');
}

function receiveEnvelope(index, total){
  const paper = document.createElement('span');
  paper.className = 'return-status__paper';
  paper.style.setProperty('--r', `${index%2 ? 4 : -4}deg`);
  paper.style.setProperty('--y', `${-Math.min(index,5)*3}px`);
  paper.style.zIndex = index + 1;
  $('returnStack').appendChild(paper);
  $('returnLabel').textContent = `결과 봉투 ${index} / ${total}`;
}

async function returnAllEnvelopes(arriving){
  S.sealed = arriving.map(o=>({ ...o, opened:false }));
  prepareReturnStatus(arriving.length);

  const flights = arriving.map((o,k)=>dropEnvelope(o, k, arriving.length));
  setTimeout(()=>scrollToShop(), 260);
  await Promise.all(flights);

  const status = $('returnStatus');
  status.classList.add('complete');
  $('returnLabel').textContent = '모든 결과 봉투가 돌아왔다';
  await waitMs(850);

  // 마지막 비행 애니메이션이 끝난 뒤에만 open_night 전용 화면을 연다.
  enterOpenNight();
  await waitMs(340);
  status.classList.remove('on','complete');
}

/* 결과 봉투 — 토큰 위치에서 화면 하단 회수 더미까지 날아온다 */
function dropEnvelope(o, index, total){
  return new Promise(resolve=>{
    setTimeout(()=>{
      const D = DUNGEONS[o.dungeon];
      const wrap = $('mapWrap');
      const wrapRect = wrap.getBoundingClientRect();
      const token = document.getElementById('tok-'+o.id);
      const node = [...document.querySelectorAll('.dnode')].find(n=>n.dataset.name===o.dungeon);
      const sourceRect = (token || node || wrap).getBoundingClientRect();
      const dockRect = $('returnStack').getBoundingClientRect();
      const sx = sourceRect.left + sourceRect.width/2 - wrapRect.left;
      const sy = sourceRect.top  + sourceRect.height/2 - wrapRect.top;
      const tx = dockRect.left + dockRect.width/2 - wrapRect.left;
      const ty = dockRect.top  + dockRect.height/2 - wrapRect.top;

      if(token){ token.classList.add('gone'); setTimeout(()=>token.remove(), 360); }

      const el = document.createElement('div');
      el.className = 'return-env';
      el.style.setProperty('--accent', D.accent);
      el.style.left = sx + 'px';
      el.style.top = sy + 'px';
      el.innerHTML = `<div class="return-env__shine"></div>
        <div class="return-env__body">
          <div class="return-env__flap"></div>
          <div class="return-env__accent"></div>
          <div class="return-env__seal"></div>
        </div>`;
      wrap.appendChild(el);

      const finish = ()=>{
        if(!el.isConnected) return;
        el.remove();
        receiveEnvelope(index+1, total);
        resolve();
      };

      if(typeof el.animate !== 'function'){
        el.style.left = tx + 'px'; el.style.top = ty + 'px';
        setTimeout(finish, 1050);
        return;
      }

      const bend = index%2 ? 34 : -34;
      const flight = el.animate([
        { left:`${sx}px`, top:`${sy}px`, opacity:0,
          transform:'translate(-50%,-50%) scale(.72) rotate(-9deg)' },
        { offset:.12, opacity:1,
          transform:'translate(-50%,-50%) scale(1) rotate(5deg)' },
        { offset:.58, left:`${(sx+tx)/2+bend}px`, top:`${Math.min(sy,ty)-46}px`,
          transform:'translate(-50%,-50%) scale(1.08) rotate(-4deg)' },
        { left:`${tx}px`, top:`${ty}px`, opacity:1,
          transform:'translate(-50%,-50%) scale(.82) rotate(0deg)' }
      ], { duration:1050, easing:'cubic-bezier(.34,.05,.3,1)', fill:'forwards' });
      flight.finished.then(finish).catch(finish);
    }, index*280);
  });
}

/* 개봉이 끝나야 비로소 하루가 시작된다 */
function openShop(){
  S.sealed = [];
  if(!S.guests.length) S.guests = makeGuests();   // 그날 손님은 이미 정해져 있다
  S.phase = 'shop';
  shopSection = 'home';
  renderMap(); renderPanel(); setPanel(false);
  if(!S.revealNode) scrollToShop();
}

/* ═══ [§scr.night] 개봉 — open_night 원본 ═══
   봉투를 탭해서 뜯는다 → 안쪽 색이 드러난다 → 결과 카드가 뜬다
   생환 · 파손 → 대여 카드 / 사망 → 색이 빠져나간다          */
let nightOpening = false;

/* 귀환 완료 전용 전환.
   setPanel(false)는 상점 페이지를 다시 켜므로 야간 개봉 진입에는 사용하지 않는다. */
function enterOpenNight(){
  S.phase = 'open';

  document.body.classList.add('night-open');

  // 지도 위에 남아 있는 화면을 모두 닫고 개봉 화면만 활성화한다.
  showPage(false);
  $('greet').classList.remove('on','peek');
  $('closing').classList.remove('on','leaving');
  $('sheet').classList.remove('on');
  $('result').classList.remove('show');
  $('mapBackBtn').classList.add('hidden');

  startOpenNight();
}

function startOpenNight(){
  const R = $('reveal');
  if(!R.querySelector('.night__stage')){
    R.innerHTML = `
      <div class="night__top">
        <div class="night__day">DAY ${S.day} · 밤 · 개봉</div>
        <div class="night__queue" id="nightQueue"></div>
      </div>
      <div class="night__stage" id="nightStage"></div>
      <div class="night__hints">
        <span class="night__hint">봉투를 탭해 뜯는다</span>
        <div class="night__counter" id="nightCounter"></div>
      </div>
      <div class="night-summary" id="nightSummary"></div>`;
  }
  R.classList.add('on');
  renderNightEnvelope();
}

function renderNightQueue(activeIndex){
  const q = $('nightQueue');
  if(!q) return;
  q.innerHTML = S.sealed.map((sl,i)=>{
    if(sl.opened) return `<span class="${sl.outcome.kind==='dead'?'dead':'alive'}"></span>`;
    return `<span class="${i===activeIndex?'on':''}"></span>`;
  }).join('');
}

function renderNightEnvelope(){
  const i = S.sealed.findIndex(sl=>!sl.opened);
  if(i < 0){ showNightSummary(); return; }
  openSealed(i);
}

function openSealed(i){
  const sl = S.sealed[i];
  if(!sl || sl.opened) return;
  S.reading = sl;
  S.readingIndex = i;
  nightOpening = false;

  const stage = $('nightStage');
  const ago = S.day - sl.dispatchDay;
  stage.innerHTML = `
    <div class="env enter" id="env">
      <div class="env__body">
        <div class="env__inner ${sl.outcome.kind==='dead'?'dead':'alive'}"></div>
        <div class="env__flap"></div>
        <div class="env__seal">封</div>
        <div class="env__label">
          <div class="env__dest">${dungeonName(sl.dungeon)}</div>
          <div class="env__who">${sl.hero.name} · ${sl.weapon.name}</div>
        </div>
      </div>
      <div class="env__hint">TAP TO TEAR</div>
    </div>`;
  $('nightCounter').textContent = `${i+1} / ${S.sealed.length}`;
  renderNightQueue(i);
  $('env').addEventListener('click', tearOpen);
}

function tearOpen(){
  const env = $('env');
  if(!env || nightOpening) return;
  nightOpening = true;
  env.classList.add('tearing');
  setTimeout(()=>{
    env.classList.remove('tearing');
    env.classList.add('opened');   // 여기서 비로소 안쪽 색이 드러난다
  }, 200);
  setTimeout(showResult, 900);
}

function showResult(){
  const sl = S.reading;
  if(!sl || sl.opened === true) return;
  sl.opened = true;
  renderNightQueue(S.readingIndex);
  const D = DUNGEONS[sl.dungeon];
  const o = sl.outcome;
  const g = GRADE[sl.weapon.grade];
  const ago = S.day - sl.dispatchDay;
  const env = $('env');
  if(env) env.classList.add('gone');

  const dead   = o.kind === 'dead';
  const broken = o.kind === 'broken';
  const verdict = dead ? '돌아오지 않았다' : '살아 돌아왔다';
  const before = sl.weapon.dur;
  const wear   = dead ? 0 : (o.wear || 0);
  const remain = Math.max(0, before - wear);

  let footHTML;
  if(dead){
    footHTML = `<div class="rcard__foot warn"><b>${sl.weapon.name}</b>은(는) 함께 사라졌다</div>`;
  } else if(broken){
    footHTML = `<div class="rcard__foot warn">여정 중에 <b>부서졌다</b></div>`;
  } else {
    const pctB = (before/sl.weapon.durMax)*100;
    const pctA = (remain/sl.weapon.durMax)*100;
    const col = pctA>60?'var(--dur-high)':pctA>30?'var(--dur-mid)':'var(--dur-low)';
    footHTML = `
      <div class="rcard__wear">
        <div class="wear__bar">
          <div class="wear__lost" data-lost style="left:${pctA}%; width:${pctB-pctA}%;"></div>
          <div class="wear__fill" data-fill style="width:${pctB}%; background:${col};"></div>
        </div>
        <div class="wear__row">
          <span class="wear__k">내구도</span>
          <span class="wear__v"><b data-num>${before}</b> / ${sl.weapon.durMax}</span>
        </div>
        <div class="wear__drop" data-drop>−${wear}</div>
      </div>`;
  }

  const rcard = $('rcard');
  rcard.className = 'rcard' + (dead ? ' lost' : '');
  rcard.innerHTML = `
    <div class="rcard__verdict ${dead?'dead':'alive'}">${verdict}</div>
    <div class="rcard__half rcard__half--hero rcard__piece--l">
      <div class="rcard__ico" style="color:${sl.hero.accent}">${ICON.hero}</div>
      <div>
        <div class="rcard__name">${sl.hero.name}</div>
        <div class="rcard__sub" data-result-dungeon>${sl.hero.dispo} · ${dungeonName(sl.dungeon)} · ${ago}일</div>
        ${dead?'<div class="rcard__gone">돌아오지 못함</div>':''}
      </div>
    </div>
    ${crackSVG(sl.id+'-seam', 212, 'rseam')}
    <div class="rcard__weaponwrap">
      ${broken?'<div class="rcard__flash"></div>':''}
      ${broken?shardsHTML(sl.id):''}
      ${broken?`<svg class="rcard__crackline" viewBox="0 0 212 110" preserveAspectRatio="none">
        <path d="${crackVertical(sl.id, 110)}"/></svg>`:''}
      <div class="rcard__half rcard__half--weapon rcard__piece--r">
        <div class="rcard__ico" style="color:${g.c}">${WSIL[sl.weapon.type]}</div>
        <div>
          <div class="rcard__name">${sl.weapon.name}</div>
          ${dead?'<div class="rcard__gone">함께 묻힘</div>':''}
        </div>
        <div class="rcard__num">${sl.weapon.atk}</div>
      </div>
    </div>
    ${footHTML}`;

  const msg = $('rmsg');
  msg.className = 'result__msg' + (dead ? ' paper' : '');
  msg.textContent = dead
    ? `${sl.hero.name}은(는) 끝내 나오지 않았다. 입구를 지키는 자가 소식을 전해왔다.`
    : broken
      ? '"안쪽에서 부러졌네. 미안하이 — 자루만 들고 왔어."'
      : `"${D.turns>2?'길이 길었어. ':''}날은 좀 상했지만, 돌아왔네."`;

  $('result').classList.add('show');

  // 결과를 세계에 반영한다
  if(dead){
    D.lost++;
  } else {
    sl.weapon.dur = remain;
    if(broken){ S.fragments++; gainMat(D, true); }
    else       { S.stock.push(sl.weapon); gainMat(D, false); }
    bringBack(sl, D);
    const resultDungeon = rcard.querySelector('[data-result-dungeon]');
    if(resultDungeon) resultDungeon.textContent = `${sl.hero.dispo} · ${dungeonName(sl.dungeon)} · ${ago}일`;
    maybeRumor();
  }

  // 내구도: 게이지가 물러나며 잃은 구간을 드러내고, 숫자가 세어 내려간다
  if(!dead && !broken){
    const fill = rcard.querySelector('[data-fill]');
    const numEl = rcard.querySelector('[data-num]');
    const dropEl = rcard.querySelector('[data-drop]');
    setTimeout(()=>{
      if(fill) fill.style.width = ((remain/sl.weapon.durMax)*100)+'%';
      if(dropEl) dropEl.classList.add('show');
      const lostEl = rcard.querySelector('[data-lost]');
      if(lostEl) setTimeout(()=>lostEl.classList.add('fade'), 1150);
      if(numEl){
        const from=before, to=remain, dur=1000, t0=performance.now();
        const tick=(t)=>{
          const p=Math.min(1,(t-t0)/dur), eased=1-Math.pow(1-p,3);
          numEl.textContent=Math.round(from+(to-from)*eased);
          if(p<1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    }, 380);
  }

  // 부서지는 순간은 카드가 다 뜬 뒤에 터뜨린다
  if(broken) setTimeout(()=>rcard.classList.add('broken'), 340);
}

/* 파편 — 무기 블록을 중심으로 사방으로 튄다 */
function shardsHTML(id){
  const rand = mulberry32(seedOf(id+'-shard'));
  let out='';
  for(let i=0;i<14;i++){
    const ang = rand()*Math.PI*2, dist = 60 + rand()*110;
    const sx = (Math.cos(ang)*dist).toFixed(0);
    const sy = (Math.sin(ang)*dist*0.85 + 40).toFixed(0);
    const sr = (rand()*720-360).toFixed(0);
    const delay = (rand()*0.12).toFixed(2);
    const scale = (0.6+rand()*0.9).toFixed(2);
    out += `<span class="shard" style="--sx:${sx}px; --sy:${sy}px; --sr:${sr}deg; `
        +  `animation-delay:${(0.38 + +delay).toFixed(2)}s; transform:scale(${scale});"></span>`;
  }
  return out;
}

/* 세로 균열선 — 무기 블록을 가른다 */
function crackVertical(id, h){
  const rand = mulberry32(seedOf(id+'-v'));
  const segs = 7;
  let d = `M ${106 + (rand()*16-8)} 0`;
  for(let i=1;i<=segs;i++){
    d += ` L ${(106 + (rand()*30-15)).toFixed(1)} ${((h/segs)*i).toFixed(1)}`;
  }
  return d;
}

/* 결과를 닫으면 다음 봉투로 */
function closeResult(){
  const res = $('result');
  if(!res.classList.contains('show')) return;
  res.classList.remove('show');
  setTimeout(()=>{
    S.reading = null;
    renderNightEnvelope();
  }, 320);
}

function showNightSummary(){
  const stage = $('nightStage');
  if(stage) stage.innerHTML = '';
  const counter = $('nightCounter');
  if(counter) counter.textContent = '';
  renderNightQueue(-1);

  const alive = S.sealed.filter(sl=>sl.outcome.kind!=='dead').length;
  const dead = S.sealed.filter(sl=>sl.outcome.kind==='dead').length;
  const broken = S.sealed.filter(sl=>sl.outcome.kind==='broken').length;
  const summary = $('nightSummary');
  summary.innerHTML = `
    <div class="night-summary__title">하루가 끝났다</div>
    <div class="night-summary__rows">
      <div class="night-summary__row alive"><span>돌아온 용사</span><b>${alive}</b></div>
      <div class="night-summary__row dead"><span>돌아오지 않은 용사</span><b>${dead}</b></div>
      <div class="night-summary__row"><span>부서진 무기</span><b>${broken}</b></div>
      <div class="night-summary__row"><span>잃은 무기</span><b>${dead}</b></div>
    </div>
    <button class="night-summary__next" id="nightSummaryNext">상점으로</button>`;
  summary.classList.add('show');
  $('nightSummaryNext').onclick = finishOpenNight;
}

function finishOpenNight(){
  const R = $('reveal');
  const summary = $('nightSummary');
  if(summary) summary.classList.remove('show');
  R.classList.remove('on');
  setTimeout(()=>{
    R.innerHTML = '';
    document.body.classList.remove('night-open');
    renderMap();
    openShop();
  }, 320);
}


/* 무엇을 가져오는가 — 귀한 재료는 드물게 나온다 */
function gainMat(D, isFragment){
  const rare = !isFragment && Math.random() < 0.22;
  const name = rare ? D.loot[1] : D.loot[0];
  S.mats[name] = (S.mats[name] || 0) + 1;
  D.lootKnown.add(name);
  return name;
}
/* 턴은 곧 하루다. 화면에는 게임 용어를 쓰지 않는다. */
const DAY_WORD = { 1:'하루', 2:'이틀', 3:'사흘', 4:'나흘', 5:'닷새' };
function dayWord(n){ return DAY_WORD[n] || `${n}일`; }

function totalMats(){ return Object.values(S.mats).reduce((a,b)=>a+b, 0); }

/* ═══ [§core.discover] 돌아온 자가 물고 오는 것 ═══
   키워드 하나 또는 재료 하나. 둘 다 아직 미발견인 것 중에서.
   그리고 그가 한 말이 장부에 남는다. */
function bringBack(s, D){
  const newKeys = D.keys.filter(k=>!D.known.has(k));
  const newLoot = D.loot.filter(l=>!D.lootKnown.has(l));

  let said = null;
  if(newKeys.length && (!newLoot.length || Math.random()<.6)){
    said = newKeys[(Math.random()*newKeys.length)|0];
    D.known.add(said);
  } else if(newLoot.length){
    // 귀한 재료일수록 늦게 나온다
    const l = (newLoot.length>1 && Math.random()<.75) ? newLoot[0] : newLoot[newLoot.length-1];
    D.lootKnown.add(l);
    toast(`${l}을(를) 가져왔다.`);
  }

  // 장부에는 그가 실제로 한 말이 남는다
  const kw = said || D.keys.filter(k=>D.known.has(k))[0] || D.keys[0];
  const cand = D.lines[kw];
  const text = cand[(Math.random()*cand.length)|0];
  D.log.push({ day:S.day, hero:s.hero.name, text, keyword:kw });
  if(said) toast(`새로운 이야기를 들었다 — ${said}`);
}

/* ═══ [§core.unlock] 소문 해금 ═══ */
function maybeRumor(){
  const locked = Object.entries(DUNGEONS).filter(([,d])=>!d.unlocked);
  if(!locked.length) return;
  const [name, D] = locked[0];
  if(!D.rumored){
    if(Math.random() < .45){ D.rumored = true; toast(`소문 — ${name}에 대한 이야기를 들었다.`); }
  } else if(Math.random() < .5){
    D.unlocked = true; D.justUnlocked = true; S.revealNode = name;
    toast(`${dungeonName(name)}으로 가겠다는 이가 나타났다.`);
  }
}

/* ═══ [§core.day] 하루 넘기기 ═══
   날이 밝으면 먼저 나가 있던 것들이 움직이고, 도착분이 돌아온다.
   손님은 그 다음이다.                                        */
function nextDay(){
  S.day++; S.sealed = [];
  $('dayLabel').textContent = `DAY ${S.day} · 던전 지도`;
  runArrival();
}

function makeGuests(){
  const dests = Object.entries(DUNGEONS).filter(([,d])=>d.unlocked).map(([n])=>n);
  const n = 1 + ((Math.random()*2.4)|0);
  const pool = [...HERO_POOL].sort(()=>Math.random()-.5).slice(0, n);
  return pool.map(h=>{
    // 성향이 목적지를 정한다 — 플레이어는 무기만 고른다
    const sorted = dests.slice().sort((a,b)=>DUNGEONS[a].turns - DUNGEONS[b].turns);
    let pick;
    if(h.dispo==='무모')      pick = sorted[Math.min(sorted.length-1, sorted.length-1 - ((Math.random()*1.4)|0))];
    else if(h.dispo==='신중') pick = sorted[(Math.random()*Math.min(2,sorted.length))|0];
    else                      pick = sorted[(Math.random()*sorted.length)|0];
    return { ...h, dest:pick };
  });
}


$('sheet').onclick = e=>{ if(e.target.id==='sheet') $('sheet').classList.remove('on'); };
$('forgePopup').onclick = e=>{ if(e.target.id==='forgePopup') closeForgePopup(); };


let toastT;
/* ═══ [§ui.toast] 토스트 ═══ */
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2000);
}

$('talk').onclick = ()=>$('talk').classList.remove('show');
$('mapBackBtn').onclick = closePeek;
$('closeShopBtn').onclick = beginNightMap;
$('result').addEventListener('click', closeResult);
$('ldrawerGrip').onclick = ()=>toggleDrawer();

/* 화면 크기가 바뀌면 카드 무대를 다시 잰다 */
let _rz;
window.addEventListener('resize', ()=>{
  clearTimeout(_rz);
  _rz = setTimeout(()=>{
    if(S.phase === 'greet' && !G.locked) syncSideOffset();
    if(typeof renderMap === 'function' && S.phase !== 'greet') renderMap();
  }, 140);
});

/* ═══ [§boot] 시작 ═══ */
S.guests = makeGuests();
S.phase = 'shop';
renderMap(); renderPanel();
requestAnimationFrame(()=>{ scrollToShop(false); setTimeout(updateHint, 200); });
</script>
