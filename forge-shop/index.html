<!DOCTYPE html>
<!--
════════════════════════════════════════════════════════════════
  명검은 반드시 부러진다 — 통합 프로토타입
════════════════════════════════════════════════════════════════

  [찾는 법]  아래 태그를 그대로 검색하면 해당 구획으로 바로 간다.
             줄번호는 편집하면 낡지만, 태그는 낡지 않는다.

  ── CSS ────────────────────────────────────────────────
  §css.top        상단 날짜 · 뒤로가기
  §css.terrain    암반 층리 · 배경
  §css.map        지도 스크롤뷰 · 노드 · 토큰
  §css.greet      접객 화면 · 용사/무기 카드
  §css.peek       지도 보기 · 상단 버튼
  §css.ldrawer    지도 위 대여 서랍
  §css.page       상점 · 개봉 페이지
  §css.night      개봉 오버레이
  §css.envelope   봉투 · 뜯기
  §css.result     결과 카드 · 마모 · 파손 · 쪽지

  ── core ── 규칙. DOM을 건드리지 않는다 ────────────────
  §core.dungeons  던전 · 키워드 · 대사
  §core.entity    용사 풀 · 등급 · makeWeapon
  §core.state     S — 하루 상태
  §core.outcome   rollOutcome · reactionOf   ← 확률
  §core.discover  bringBack — 키워드/재료 발견
  §core.unlock    소문 해금
  §core.day       nextDay · makeGuests

  ── ui ── 공용 부품 ────────────────────────────────────
  §ui.rand        mulberry32 · crackSVG
  §ui.icon        아이콘 · 무기 실루엣
  §ui.sheet       던전 상세 시트
  §ui.toast       토스트

  ── screens ────────────────────────────────────────────
  §scr.greet      접객 — 스와이프 · 건네기
  §scr.peek       지도 보기 — 던전 카드 뒷면에 소문
  §scr.ldrawer    지도 위 대여 서랍 — 행 탭하면 토큰으로
  §scr.dfocus     지도 카드 — 가운데로 불러내기 · 뒤집기
  §scr.map        지도 렌더 · 토큰
  §scr.page       상점 · 개봉 페이지
  §scr.seq        저녁 파견 시퀀스
  §scr.arrival    아침 진행 · 귀환
  §scr.night      개봉 — 봉투 · 결과
  §boot           시작

  [규율]  core 구획의 함수는 document / $() 를 쓰지 않는다.
          Vite 이관 시 core 는 그대로 잘라 붙일 수 있어야 한다.

  [구현]    제작소 → 재료 3개 선택 팝업 → 벼리기
════════════════════════════════════════════════════════════════
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>던전 지도 프로토타입</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg-void:#161210;
  --bg-card:#251e17;
  --ink:#e9ddc6;
  --ink-dim:#a2917a;
  --line-metal:#5c5142;

  --grade-common:#6b6355;
  --grade-mid:#8f9aa3;
  --grade-high:#c9963f;
  --grade-unique:#cf5b2e;

  --attr-frost:#5f93b0;
  --attr-fire:#9c3f26;
  --attr-holy:#c7a542;
  --attr-none:#7d7568;

  --dur-high:#7a9b76;
  --dur-mid:#c9963f;
  --dur-low:#9c3f26;

  --stamp-ink:#8c3a2c;

  --font-display:'Black Han Sans', sans-serif;
  --font-body:'Noto Sans KR', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0; background:radial-gradient(ellipse at 50% -10%, #241c15 0%, var(--bg-void) 55%);
  color:var(--ink); font-family:var(--font-body);
  display:flex; align-items:center; justify-content:center; padding:16px;
}
body.night-open{ overflow:hidden; overscroll-behavior:none; }
.phone{
  width:390px; height:600px; max-height:90vh;
  background:radial-gradient(ellipse at 50% 0%, #241c15 0%, var(--bg-void) 60%);
  border-radius:22px; border:1px solid var(--line-metal);
  box-shadow:0 18px 40px rgba(0,0,0,.55);
  position:relative; overflow:hidden; display:flex; flex-direction:column;
}

/* ══ [§css.top] 상단 ══ */
.top{ padding:12px 12px 6px; flex-shrink:0; z-index:14; }
.top__bar{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.day{ font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; color:var(--ink-dim); text-align:center; flex:1; }
.backbtn{
  width:42px; height:42px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:var(--bg-card); border:1px solid var(--line-metal); border-radius:7px;
  color:var(--ink); font-size:24px; line-height:1; cursor:pointer; transition:border-color .15s, color .15s, transform .12s;
}
.backbtn:active{ transform:scale(.94); }
.backbtn:hover{ border-color:var(--grade-unique); color:var(--ink); }
.backbtn.hidden{ opacity:0; pointer-events:none; }
.topbtn{
  display:flex; align-items:center; gap:6px; background:var(--bg-card);
  border:1px solid var(--line-metal); border-radius:4px; padding:6px 9px;
  cursor:pointer; flex-shrink:0; transition:border-color .15s, opacity .3s;
}
.topbtn:hover{ border-color:var(--grade-unique); }
.topbtn__label{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.08em; color:var(--ink-dim); }
.topbtn__count{
  min-width:17px; height:17px; border-radius:9px; padding:0 4px; background:var(--grade-unique);
  color:#1a1512; font-family:var(--font-mono); font-weight:700; font-size:10px;
  display:flex; align-items:center; justify-content:center;
}
.topbtn--off{ opacity:.32; pointer-events:none; }

/* ══ [§css.terrain] 지형 배경 ══ */
.backdrop{
  position:absolute; left:0; top:0; width:100%; height:100%;
  pointer-events:none; z-index:1;
}
/* 깊은 곳에 깔리는 안개 */
.mist{
  position:absolute; left:-10%; width:120%; height:70px; pointer-events:none; z-index:3;
  background:radial-gradient(ellipse at 50% 50%, rgba(150,160,170,.075) 0%, rgba(150,160,170,0) 70%);
  animation:mistDrift 22s ease-in-out infinite;
}
@keyframes mistDrift{ 0%,100%{ transform:translateX(-18px);} 50%{ transform:translateX(18px);} }
/* 화롯불 잔불 */
.ember{
  position:absolute; width:2px; height:2px; border-radius:50%;
  background:var(--attr-fire); pointer-events:none; z-index:3; opacity:0;
  animation:emberRise 5.5s linear infinite;
}
@keyframes emberRise{
  0%{ opacity:0; transform:translateY(0) scale(.6);} 12%{ opacity:.85;}
  70%{ opacity:.45;} 100%{ opacity:0; transform:translateY(-58px) scale(.3);}
}

/* 이정표 — 턴이 끊기는 자리 */
.milestone{
  position:absolute; margin-left:-9px; width:18px; height:18px; z-index:4;
  color:#4e4438; pointer-events:none;
}
.milestone svg{ width:18px; height:18px; }

/* ══ [§css.map] 지도 — 스크롤뷰 ══
   부모(wrapper)가 flex 컨테이너가 아니므로 flex:1은 듣지 않는다.
   inset:0으로 스크롤 컨테이너의 높이를 확정해야 overflow가 작동한다. */
.map{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
}
.map::-webkit-scrollbar{ width:0; display:none; }
.map__inner{ position:relative; width:100%; }

/* 스크롤 뷰포트 가장자리 — 위아래로 어둠에 잠기게 */
.map__fade{
  position:absolute; left:0; right:0; height:46px; pointer-events:none; z-index:11;
}
.map__fade--top{ top:0; background:linear-gradient(180deg, #191411 0%, rgba(25,20,17,0) 100%); }
.map__fade--bot{ bottom:0; background:linear-gradient(0deg, #171310 0%, rgba(23,19,16,0) 100%); }

/* 깊이 눈금 — 세로축이 곧 거리라는 것을 읽히게 */
.tick{
  position:absolute; left:8px; display:flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:8px; letter-spacing:.14em; color:#4c4237;
  pointer-events:none; z-index:4;
}
.tick::after{ content:''; display:block; width:340px; height:1px; background:linear-gradient(90deg, #352d26 0%, rgba(53,45,38,0) 78%); }

/* 스크롤 힌트 */
.scrollhint{
  position:absolute; left:50%; transform:translateX(-50%); bottom:52px; z-index:12;
  font-family:var(--font-mono); font-size:8.5px; letter-spacing:.16em; color:var(--ink-dim);
  opacity:0; transition:opacity .5s; pointer-events:none;
}
.scrollhint.on{ opacity:.7; animation:hintFloat 2.4s ease-in-out infinite; }
@keyframes hintFloat{ 0%,100%{ transform:translate(-50%,0);} 50%{ transform:translate(-50%,-4px);} }

/* 어둠 — 미해금 구역 */
.dark{
  position:absolute; left:0; right:0; top:0; height:170px;
  background:linear-gradient(180deg, #0b0908 0%, #0d0a08 42%, rgba(13,10,8,.8) 70%, rgba(22,18,16,0) 100%);
  pointer-events:none; z-index:5;
}
.dark__label{
  position:absolute; left:0; right:0; top:34px; text-align:center;
  font-family:var(--font-mono); font-size:8.5px; letter-spacing:.22em; color:#3d342c;
}
.rumor{
  position:absolute; top:76px; text-align:center; width:118px;
  font-family:var(--font-display); font-size:14px; color:#57493c;
  filter:blur(1.1px); opacity:0; transition:opacity 1.1s ease;
}
.rumor.on{ opacity:1; animation:rumorPulse 4.2s ease-in-out infinite; }
.rumor small{ display:block; font-family:var(--font-mono); font-size:7.5px; letter-spacing:.1em; margin-top:3px; filter:blur(.4px); }
@keyframes rumorPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:.9; } }

/* 레인 — 던전에서 상점까지의 길 */
.lane{ position:absolute; width:2px; background:repeating-linear-gradient(180deg, var(--line-metal) 0 3px, transparent 3px 9px); opacity:.42; }

/* 던전 카드 (지도용 소형) */
.dnode{
  position:absolute; width:112px; margin-left:-56px;
  background:var(--bg-card); border:1px solid var(--line-metal); border-radius:5px;
  box-shadow:0 6px 16px rgba(0,0,0,.5); cursor:pointer;
  transition:border-color .18s, transform .3s cubic-bezier(.34,1.4,.64,1),
             width .45s cubic-bezier(.4,.15,.2,1), margin-left .45s cubic-bezier(.4,.15,.2,1);
  z-index:6; perspective:900px; background:transparent; border:none; box-shadow:none;
}
.dnode__inner{
  position:relative; width:100%; transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.15,.2,1);
}
.dnode.flipped{ width:224px; margin-left:-112px; z-index:30; }
.dnode.flipped .dnode__inner{ transform:rotateY(180deg); }
.dnode__face{
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--bg-card); border:1px solid var(--line-metal); border-radius:5px;
  box-shadow:0 6px 16px rgba(0,0,0,.5); overflow:hidden;
}
.dnode__front{ position:relative; }
.dnode__back{ position:absolute; inset:0; transform:rotateY(180deg); }
.dnode.flipped .dnode__front{ position:absolute; inset:0; }
.dnode.flipped .dnode__back{ position:relative; inset:auto; }
.dnode:hover .dnode__face{ border-color:var(--accent); }

/* 카드를 화면 가운데로 불러내는 층 —
   지도 스크롤 위에 얹혀서, 원래 자리의 카드는 숨겨두고
   같은 카드를 이 층에서 다시 그려 가운데로 날아가게 한다. */
.dfocus{ position:absolute; inset:0; z-index:32; opacity:0; pointer-events:none; transition:opacity .3s; }
.dfocus.on{ opacity:1; pointer-events:auto; background:rgba(10,8,7,.5); }
.dfocus-card{
  left:50%; top:50%; margin:0 !important; z-index:33;
  transition:transform .5s cubic-bezier(.4,.15,.2,1), width .45s cubic-bezier(.4,.15,.2,1) !important;
  max-height:78%;
}
.dfocus-card .dnode__face{ box-shadow:0 20px 46px rgba(0,0,0,.6); }
.dfocus-card .dnode__back .dback{ max-height:296px; overflow-y:auto; }
.dfocus-card .dnode__back .dback::-webkit-scrollbar{ display:none; }
.token.ping{ animation:tokPing 1.1s ease-out; z-index:20; }
@keyframes tokPing{
  0%{ transform:scale(1); filter:none; }
  22%{ transform:scale(1.5); filter:drop-shadow(0 0 12px var(--accent)) brightness(1.5); }
  100%{ transform:scale(1); filter:none; }
}
.dnode.new{ animation:nodeIn .6s cubic-bezier(.34,1.4,.64,1); }
@keyframes nodeIn{ from{ opacity:0; transform:translateY(-14px) scale(.9); } to{ opacity:1; transform:none; } }
.dnode__accent{ height:4px; background:var(--accent); }
.dnode__body{ padding:7px 9px 8px; text-align:center; }
.dnode__ico{ width:26px; height:26px; margin:0 auto 1px; color:var(--accent); }
.dnode__name{ font-family:var(--font-display); font-size:13.5px; line-height:1.2; }
.dnode__turn{ font-family:var(--font-mono); font-size:9px; color:var(--ink-dim); margin-top:3px; letter-spacing:.05em; }
.dnode__log{ font-size:8.5px; color:var(--ink-dim); margin-top:4px; line-height:1.4; }
.dnode__log b{ color:var(--dur-low); font-weight:700; }
.dnode__seam{ display:block; width:100%; height:7px; }
.dnode__seam path{ stroke:var(--line-metal); stroke-width:1.2; fill:none; }

/* 토큰 — 나가 있는 무기 */
.token{
  position:absolute; width:40px; margin-left:-20px; z-index:8;
  transition:top .42s cubic-bezier(.34,1.25,.64,1), left .42s cubic-bezier(.34,1.25,.64,1), opacity .32s;
  text-align:center; pointer-events:none;
}
.token__glyph{
  width:30px; height:30px; margin:0 auto; color:var(--accent);
  background:rgba(22,18,16,.9); border:1px solid var(--line-metal); border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 9px rgba(0,0,0,.6);
}
.token__glyph svg{ width:21px; height:21px; }
.token__step{ font-family:var(--font-mono); font-size:7.5px; color:var(--ink-dim); margin-top:2px; letter-spacing:.04em; }
.token.jump .token__glyph{ animation:tokenJump .32s cubic-bezier(.34,1.5,.64,1); }
@keyframes tokenJump{ 0%{ transform:translateY(0);} 40%{ transform:translateY(-7px) scale(1.06);} 100%{ transform:translateY(0);} }
.token.gone{ opacity:0; }

/* 던전 안으로 들어간다 — 잠시 머무는 동안 토큰이 어둠에 잠긴다 */
.token.inside{ z-index:4; }
.token.inside .token__glyph{
  transition:transform .5s cubic-bezier(.4,.15,.2,1), opacity .5s, background .5s;
  transform:scale(.72); opacity:.45; background:rgba(10,8,7,.95);
}
.token.inside .token__step{ opacity:0; transition:opacity .3s; }

/* 던전이 삼킨다 */
@keyframes nodeSwallow{
  0%,100%{ box-shadow:0 6px 16px rgba(0,0,0,.5); }
  35%{ box-shadow:0 6px 16px rgba(0,0,0,.5), 0 0 22px 3px var(--accent); }
}
.dnode.swallow{ animation:nodeSwallow 1.1s ease-in-out; }

/* 지도 위를 날아오는 결과 봉투 — 야간 개봉 봉투(.env)와 완전히 분리한다 */
.return-env{
  position:absolute; width:52px; height:36px; z-index:22;
  pointer-events:none; filter:drop-shadow(0 8px 12px rgba(0,0,0,.72));
  transform:translate(-50%,-50%);
}
.return-env__body{
  position:absolute; inset:0; overflow:hidden;
  background:linear-gradient(155deg,#3b3127 0%,#28211b 100%);
  border:1px solid var(--line-metal); border-radius:3px;
}
.return-env__flap{
  position:absolute; inset:0 0 auto; height:21px;
  background:#342a22; border-bottom:1px solid rgba(117,91,64,.72);
  clip-path:polygon(0 0,100% 0,50% 100%);
}
.return-env__accent{ position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--accent); }
.return-env__seal{
  position:absolute; left:50%; top:16px; transform:translate(-50%,-50%);
  width:12px; height:12px; border-radius:50%; z-index:2;
  background:var(--stamp-ink); box-shadow:0 0 0 1px rgba(0,0,0,.5) inset;
}
.return-env__shine{
  position:absolute; inset:-12px; z-index:-1; opacity:.7;
  background:radial-gradient(circle, color-mix(in srgb,var(--accent) 38%,transparent) 0%,transparent 68%);
}

.return-status{
  position:absolute; left:50%; bottom:18px; z-index:21;
  transform:translate(-50%,12px); opacity:0; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  transition:opacity .28s, transform .36s cubic-bezier(.34,1.35,.64,1);
}
.return-status.on{ opacity:1; transform:translate(-50%,0); }
.return-status__stack{ position:relative; width:72px; height:42px; }
.return-status__paper{
  position:absolute; left:50%; top:50%; width:54px; height:34px;
  border:1px solid var(--line-metal); border-radius:3px;
  background:linear-gradient(155deg,#3b3127,#28211b);
  box-shadow:0 5px 12px rgba(0,0,0,.55);
  transform:translate(-50%,-50%) rotate(var(--r,0deg)) translateY(var(--y,0px));
  animation:returnPaperIn .34s cubic-bezier(.34,1.55,.64,1);
}
.return-status__paper::after{
  content:''; position:absolute; left:50%; top:8px; width:10px; height:10px;
  transform:translateX(-50%); border-radius:50%; background:var(--stamp-ink);
}
.return-status__label{
  min-width:150px; padding:6px 10px; text-align:center;
  font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; color:var(--ink-dim);
  border:1px solid var(--line-metal); border-radius:3px; background:rgba(18,15,13,.92);
}
.return-status.complete .return-status__stack{ animation:returnStackPulse .62s cubic-bezier(.34,1.55,.64,1); }
.return-status.complete .return-status__label{ color:var(--ink); border-color:var(--grade-unique); }
@keyframes returnPaperIn{
  from{ opacity:0; transform:translate(-50%,-50%) translateY(-16px) rotate(-8deg) scale(.8); }
}
@keyframes returnStackPulse{
  0%,100%{ transform:scale(1); } 45%{ transform:scale(1.14) translateY(-4px); }
}
/* 상점 */
.shop{
  position:absolute; left:0; right:0; height:64px; z-index:7;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
}
.shop__house{ width:96px; height:46px; color:var(--ink-dim); position:relative; }
.shop__house svg{ width:96px; height:46px; }
.shop__win{
  position:absolute; left:50%; top:26px; transform:translateX(-50%);
  width:13px; height:11px; background:var(--grade-high); border-radius:1px;
  box-shadow:0 0 12px 3px rgba(201,150,63,.42);
  animation:forgeGlow 3.6s ease-in-out infinite;
}
@keyframes forgeGlow{ 0%,100%{ opacity:.72; } 45%{ opacity:1; } }
.shop__label{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.2em;
  color:var(--ink-dim); margin-top:2px;
}

/* ══ [§css.greet] 접객 — 낮 ══ */
.greet{
  position:absolute; inset:0; z-index:26; display:flex; flex-direction:column;
  background:radial-gradient(ellipse at 50% -10%, #261e16 0%, var(--bg-void) 62%);
  opacity:0; pointer-events:none; transition:opacity .32s;
}
.greet.on{ opacity:1; pointer-events:auto; }
.greet__top{ padding:11px 14px 0; display:flex; align-items:center; justify-content:space-between; }
.greet__day{ font-family:var(--font-mono); font-size:10px; letter-spacing:.16em; color:var(--ink-dim); }
.queue{ display:flex; gap:6px; }
.queue span{ width:7px; height:7px; border-radius:50%; background:rgba(233,221,198,.14); }
.queue span.on{ background:var(--grade-unique); }
.queue span.done{ background:var(--line-metal); }

/* ══ 영업 종료 — 모든 무기를 빌려준 뒤 지도 버튼을 누르는 전환 화면 ══ */
.closing{
  position:absolute; inset:0; z-index:29; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px; text-align:center;
  background:radial-gradient(ellipse at 50% 35%,#261f18 0%,#0d0a08 70%);
  opacity:0; pointer-events:none; transition:opacity .36s;
}
.closing.on{ opacity:1; pointer-events:auto; }
.closing__door{
  position:relative; width:126px; height:148px; margin-bottom:24px;
  border:1px solid var(--line-metal); border-radius:5px 5px 2px 2px;
  background:#18130f; box-shadow:0 18px 38px rgba(0,0,0,.64),0 0 26px rgba(201,150,63,.08);
  overflow:hidden;
}
.closing__door::before,.closing__door::after{
  content:''; position:absolute; top:0; bottom:0; width:50%;
  background:linear-gradient(90deg,#2f261e,#211a15);
  border:1px solid rgba(117,91,64,.55);
  transition:transform .66s cubic-bezier(.45,.05,.25,1);
}
.closing__door::before{ left:0; transform-origin:left; }
.closing__door::after{ right:0; transform-origin:right; }
.closing__door-glow{
  position:absolute; left:50%; top:50%; width:2px; height:86%; transform:translate(-50%,-50%);
  background:var(--grade-unique); box-shadow:0 0 15px 3px rgba(201,150,63,.26);
  animation:closingGlow 2.2s ease-in-out infinite;
}
@keyframes closingGlow{ 0%,100%{ opacity:.35; } 50%{ opacity:.9; } }
.closing__k{ font-family:var(--font-mono); font-size:9px; letter-spacing:.22em; color:var(--grade-unique); }
.closing__title{ margin-top:9px; font-family:var(--font-display); font-size:24px; color:var(--ink); }
.closing__desc{ max-width:260px; margin-top:10px; font-size:12px; line-height:1.65; color:var(--ink-dim); }
.closing__count{
  display:flex; align-items:center; gap:7px; margin-top:15px;
  font-family:var(--font-mono); font-size:10px; color:var(--ink-dim);
}
.closing__count b{ color:var(--ink); font-size:13px; }
.closing__btn{
  width:min(270px,100%); margin-top:24px; padding:13px 16px;
  border:1px solid var(--grade-unique); border-radius:4px;
  background:rgba(201,150,63,.08); color:var(--ink); cursor:pointer;
  font-family:var(--font-body); font-size:13px; font-weight:700;
  transition:transform .18s,background .18s;
}
.closing__btn:active{ transform:scale(.98); background:rgba(201,150,63,.16); }
.closing__btn:disabled{ opacity:.5; pointer-events:none; }
.closing.leaving .closing__door::before{ transform:translateX(-102%); }
.closing.leaving .closing__door::after{ transform:translateX(102%); }

/* ── 용사 카드 ── */
.hero-zone{ flex-shrink:0; padding:4px 16px 0; display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; }
.hero-card{
  width:154px; height:140px; cursor:grab; touch-action:pan-y;
  transition:transform .3s cubic-bezier(.34,1.4,.64,1), opacity .3s;
  will-change:transform; position:relative; animation:heroIn .4s ease-out;
}
.hero-card.dragging{ transition:none; cursor:grabbing; }
@keyframes heroIn{ from{ transform:translateY(16px); opacity:0; } to{ transform:none; opacity:1; } }
.hero-card__face{
  width:100%; height:100%; background:var(--bg-card);
  border:1px solid var(--line-metal); border-radius:5px; overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.45); display:flex; flex-direction:column;
}
.hero-card__accent{ height:4px; background:var(--h-accent,#888); flex-shrink:0; }
.hero-card__inner{ padding:5px 12px 8px; text-align:center; flex:1; display:flex; flex-direction:column; justify-content:center; }
.hero-ico{ width:36px; height:36px; margin:0 auto; color:var(--h-accent,#888); }
.hero-name{ font-family:var(--font-display); font-size:15px; margin-top:2px; }
.hero-chip{ font-size:10px; color:var(--ink-dim); margin-top:2px; }
.hero-skill{ font-family:var(--font-mono); font-weight:700; font-size:12px; color:var(--ink); margin-top:5px; }
.hero-card.talking{ animation:talk .5s ease-in-out; }
@keyframes talk{ 0%,100%{ transform:rotate(0) translateY(0);} 30%{ transform:rotate(-2deg) translateY(-4px);} 65%{ transform:rotate(1.5deg) translateY(-1px);} }
.hero-card__send{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-4deg);
  font-family:var(--font-display); font-size:17px; color:var(--ink);
  border:2px solid var(--dur-low); background:rgba(22,18,16,.86);
  padding:5px 13px; border-radius:4px; opacity:0; pointer-events:none; z-index:5; white-space:nowrap;
}
.hero-drag-hint{ font-size:9.5px; color:var(--ink-dim); margin-top:4px; letter-spacing:.02em; }

/* ── 말풍선 ── */
.bubble{
  position:relative; margin:7px 10px 0;
  background:var(--bg-card); border:1px solid var(--line-metal); border-radius:5px;
  padding:8px 14px; font-size:12px; line-height:1.5; color:var(--ink);
  cursor:pointer; min-height:44px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  animation:bubbleIn .3s ease-out;
}
@keyframes bubbleIn{ from{ opacity:0; transform:translateY(-5px);} to{ opacity:1; transform:none;} }
.bubble::before{
  content:''; position:absolute; top:-9px; left:50%; margin-left:-7px;
  border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:8px solid var(--line-metal);
}
.bubble__hint{ position:absolute; right:9px; bottom:5px; font-family:var(--font-mono); font-size:9px; color:var(--ink-dim); letter-spacing:.08em; }
.bubble__tail{ display:block; color:var(--ink-dim); font-size:11px; margin-top:5px; }

/* ── 무기 카드 ── */
.deck-zone{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; margin-top:5px; min-height:186px; z-index:10; }
.rail{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.wcard{
  position:absolute; width:152px; height:220px; cursor:grab; touch-action:pan-y;
  transition:transform .32s cubic-bezier(.34,1.4,.64,1), opacity .3s;
  will-change:transform;
}
.wcard.dragging{ transition:none; cursor:grabbing; }
.wcard--side{ pointer-events:none; opacity:.4; filter:brightness(.62) saturate(.7); z-index:0; }
.wcard--side.prev{ transform:translateX(calc(-1 * var(--side, 142px))) scale(.84) rotate(-4deg); }
.wcard--side.next{ transform:translateX(var(--side, 142px)) scale(.84) rotate( 4deg); }
.wcard--center{ z-index:2; }
.wcard__face{
  width:100%; height:100%; background:var(--bg-card);
  border:1px solid var(--line-metal); border-radius:5px; overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.5); display:flex; flex-direction:column;
}
.wcard__accent{ height:5px; background:var(--accent,#888); flex-shrink:0; }
.wcard--unique .wcard__accent{ animation:ember 2.6s ease-in-out infinite; }
@keyframes ember{ 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.55);} }
.wcard__thumb{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.wcard__thumb::before{
  content:''; position:absolute; width:150%; aspect-ratio:1; border-radius:50%;
  background:var(--accent,#888); opacity:.13; filter:blur(1px);
}
.wcard__thumb svg{ width:66px; height:66px; color:var(--accent,#888); position:relative; z-index:1; filter:drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
.crack{ display:block; width:100%; height:10px; flex-shrink:0; }
.crack path{ stroke:var(--line-metal); stroke-width:1.4; fill:none; }
.wcard__info{ padding:6px 12px 9px; text-align:center; flex-shrink:0; }
.wcard__grade{ font-size:10.5px; color:var(--ink-dim); }
.wcard__name{ font-family:var(--font-display); font-size:15px; margin-top:1px; }
.wcard__atk{ font-family:var(--font-mono); font-weight:700; font-size:16px; margin-top:2px; }
.gauge{ height:5px; border-radius:3px; background:rgba(255,255,255,.06); overflow:hidden; margin-top:5px; }
.gauge__fill{ height:100%; border-radius:3px; }
.wcard__brit{ font-family:var(--font-mono); font-size:9px; color:var(--ink-dim); margin-top:4px; }
.wcard__brit b{ color:var(--dur-low); font-weight:700; }
.flip-hint{
  position:absolute; right:9px; bottom:7px; z-index:3;
  font-family:var(--font-mono); font-size:8px; letter-spacing:.1em; color:var(--ink-dim); opacity:.6;
}
.stampMark{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-11deg);
  font-family:var(--font-display); font-size:22px; color:var(--ink);
  background:rgba(22,18,16,.86); padding:6px 16px; border-radius:4px;
  opacity:0; pointer-events:none; z-index:4;
}
.stampMark.give{ border:2px solid var(--dur-high); }
.counter{ text-align:center; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; color:var(--ink-dim); padding:2px 0 0; }
.greet__hint{ flex-shrink:0; text-align:center; padding:3px 14px 9px; font-size:10px; color:var(--ink-dim); line-height:1.6; }
.greet__hint b{ color:var(--ink); font-weight:700; }
.greet__empty{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; color:var(--ink-dim); font-size:12px; padding:0 30px; text-align:center;
}

/* ── 대여 카드 (용사+무기 합본) ── */
.loan-card{
  width:186px; background:var(--bg-card); border:1px solid var(--line-metal);
  border-radius:5px; overflow:hidden; box-shadow:0 10px 26px rgba(0,0,0,.55);
  flex:0 0 186px;
}
.loan-card--big{ width:212px; flex-basis:212px; }
.loan-said{
  min-height:39px; padding:9px 12px 8px;
  border-bottom:1px dashed var(--line-metal); background:rgba(0,0,0,.2);
  font-size:11px; line-height:1.5; color:var(--ink);
  display:flex; align-items:center;
}
.loan-half{ display:flex; align-items:center; gap:11px; padding:13px 12px; }
.loan-half__ico{ width:42px; height:42px; flex-shrink:0; }
.loan-half__txt{ min-width:0; flex:1; }
.loan-half__name{ font-family:var(--font-display); font-size:15px; line-height:1.2; }
.loan-half__sub{ font-size:10px; color:var(--ink-dim); margin-top:2px; }
.loan-half__num{ font-family:var(--font-mono); font-weight:700; font-size:15px; color:var(--ink); }
.loan-card--big .loan-half{ padding:17px 14px; }
.loan-card--big .loan-half__ico{ width:54px; height:54px; }
.loan-card--big .loan-half__name{ font-size:19px; }
.loan-card--big .loan-half__num{ font-size:19px; }
.loan-seam{ display:block; width:100%; height:10px; }
.loan-seam path{ stroke:var(--line-metal); stroke-width:1.4; fill:none; }
.loan-card__foot{
  font-size:9.5px; color:var(--ink-dim); text-align:center;
  padding:8px 10px 11px; border-top:1px dashed var(--line-metal);
}
.loan-card__foot--split{
  min-height:43px; display:flex; align-items:center; justify-content:space-between;
  gap:8px; text-align:left;
}
.loan-card__place{ font-family:var(--font-display); font-size:12.5px; line-height:1.25; }
.loan-card__wait{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.02em; text-align:right; }
.loan-card--map{ scroll-snap-align:start; transition:border-color .15s, transform .15s; }
.loan-card--map[data-tok]{ cursor:pointer; }
.loan-card--map[data-tok]:active{ transform:scale(.985); }
.loan-card--map[data-tok]:hover{ border-color:var(--grade-unique); }
.loan-card--big .loan-card__foot{ font-size:11px; padding:9px 10px 12px; }

/* ── 합체 리빌 ── */
.merge-overlay{
  position:absolute; inset:0; z-index:28; background:rgba(10,8,7,0);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .28s ease, background .28s ease;
}
.merge-overlay.show{ opacity:1; background:rgba(10,8,7,.66); }
.merge-card-wrap{
  transform:scale(.8); opacity:0;
  transition:transform .38s cubic-bezier(.34,1.5,.64,1), opacity .3s;
}
.merge-overlay.show .merge-card-wrap{ transform:scale(1); opacity:1; }
.merge-bubble{
  position:absolute; left:0; top:0;
  background:var(--bg-card); border:1px solid var(--line-metal); border-radius:5px;
  padding:10px 16px; font-size:13px; line-height:1.5; color:var(--ink);
  max-width:250px; width:max-content; text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.5);
  transform:translate(-50%, 14px) scale(.9); opacity:0;
  transition:transform .32s cubic-bezier(.34,1.4,.64,1), opacity .28s;
}
.merge-bubble.show{ transform:translate(-50%, 14px) scale(1); opacity:1; }
.merge-bubble::after{
  content:''; position:absolute; top:-9px; left:50%; margin-left:-8px;
  border-left:8px solid transparent; border-right:8px solid transparent; border-bottom:9px solid var(--line-metal);
}
.merge-bubble__mood{ display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; margin-bottom:4px; }
.merge-bubble.good .merge-bubble__mood{ color:var(--dur-high); }
.merge-bubble.mid  .merge-bubble__mood{ color:var(--dur-mid); }
.merge-bubble.bad  .merge-bubble__mood{ color:var(--dur-low); }

/* ── 말 되짚기 오버레이 ── */
.talk{
  position:absolute; inset:0; z-index:30; background:rgba(10,8,7,.9);
  display:flex; align-items:center; justify-content:center; padding:30px;
  opacity:0; pointer-events:none; transition:opacity .24s;
}
.talk.show{ opacity:1; pointer-events:auto; }
.talk__box{
  background:var(--bg-card); border:1px solid var(--line-metal); border-radius:6px;
  padding:18px 20px; max-width:280px; box-shadow:0 16px 40px rgba(0,0,0,.66);
}
.talk__who{ font-family:var(--font-mono); font-size:9px; letter-spacing:.16em; color:var(--ink-dim); }
.talk__line{ font-size:14px; line-height:1.65; margin-top:9px; }
.talk__more{ font-size:12px; line-height:1.7; color:var(--ink-dim); margin-top:10px; }
.talk__close{ text-align:center; font-family:var(--font-mono); font-size:9.5px; color:var(--ink-dim); margin-top:15px; }

/* ══ [§css.peek] 지도 보기 · 던전 카드 뒷면 ══ */
.greet.peek{ opacity:0; pointer-events:none; }


/* 지도 버튼 — 구석에 조용히 */
.greet__topr{ display:flex; align-items:center; gap:9px; }
.mapbtn{
  display:flex; align-items:center; gap:5px; cursor:pointer;
  background:transparent; border:1px solid var(--line-metal); border-radius:4px;
  padding:5px 8px; color:var(--ink-dim); transition:border-color .15s, color .15s;
}
.mapbtn:hover{ border-color:var(--grade-unique); color:var(--ink); }
.mapbtn.on{ color:var(--ink); }
.mapbtn__ico{ width:13px; height:13px; display:block; }
.mapbtn__ico svg{ width:100%; height:100%; }
.mapbtn__t{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.04em; }

/* 키워드 · 재료 */
.key{
  font-size:10px; padding:2.5px 7px; border-radius:3px;
  background:rgba(233,221,198,.09); border:1px solid var(--line-metal); color:var(--ink);
}
.key--q{ color:#4e4438; border-style:dashed; min-width:24px; text-align:center; }
.loot{ font-family:var(--font-mono); font-size:9.5px; color:var(--grade-high); }
.loot::before{ content:'◆ '; opacity:.6; }
.loot--q{ color:#4e4438; }

/* 던전 카드 뒷면 — 누런 장부. 부고와 다른 종이다. */
.dback{ background:#c8b895; color:#33281d; padding:9px 11px 10px;
  background-image:repeating-linear-gradient(0deg, rgba(90,70,52,.09) 0 1px, transparent 1px 19px); }
.dback__head{ display:flex; align-items:baseline; justify-content:space-between;
  border-bottom:1px solid rgba(90,70,52,.4); padding-bottom:5px; }
.dback__name{ font-family:var(--font-display); font-size:14px; }
.dback__k{ font-family:var(--font-mono); font-size:7.5px; letter-spacing:.24em; color:#7a6048; }
.dback__keys{ display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.dback__keys .key{ background:rgba(90,70,52,.13); border-color:rgba(90,70,52,.4); color:#33281d; font-size:9.5px; }
.dback__keys .key--q{ color:#9a8368; }
.dback__loot{ display:flex; gap:6px; margin-top:6px; }
.dback__loot .loot{ color:#7a5a20; font-size:9px; }
.dback__loot .loot--q{ color:#9a8368; }
.dback__list{ max-height:132px; overflow-y:auto; margin-top:7px;
  border-top:1px dashed rgba(90,70,52,.35); }
.dback__list::-webkit-scrollbar{ display:none; }
.dback__row{ padding:6px 0; border-bottom:1px dashed rgba(90,70,52,.28); }
.dback__meta{ font-family:var(--font-mono); font-size:8px; color:#7a6048; letter-spacing:.05em; }
.dback__quote{ font-size:11px; line-height:1.5; margin-top:2px; }
.dback__empty{ font-size:10.5px; color:#7a6048; padding:14px 0; text-align:center; }
.dback__sum{ font-size:9.5px; color:#5c4636; margin-top:7px; }

/* ══ [§css.ldrawer] 지도 위의 대여 서랍 ══
   지도와 같은 화면에 있어야 한다.
   저 길 위 어디쯤에 내 것이 있는지 보면서 목록을 읽는다. */
.ldrawer{
  position:absolute; left:0; right:0; bottom:0; z-index:27;
  background:linear-gradient(180deg, rgba(29,23,18,.97) 0%, rgba(23,19,16,.99) 100%);
  border-top:1px solid var(--line-metal);
  box-shadow:0 -10px 26px rgba(0,0,0,.55);
  max-height:38px; overflow:hidden;
  transition:max-height .4s cubic-bezier(.4,.15,.2,1), opacity .26s;
  opacity:0; pointer-events:none;
}
.ldrawer.on{ opacity:1; pointer-events:auto; }
.ldrawer.open{ max-height:60%; }
.ldrawer__grip{
  display:flex; align-items:center; gap:8px; padding:11px 14px 10px; cursor:pointer;
}
.ldrawer__title{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.2em; color:var(--ink-dim); }
.ldrawer__count{ flex:1; font-family:var(--font-mono); font-size:9.5px; color:var(--ink); }
.ldrawer__chev{ font-size:10px; color:var(--ink-dim); transition:transform .35s; }
.ldrawer.open .ldrawer__chev{ transform:rotate(180deg); }
.ldrawer__body{ padding:0 0 14px; overflow:hidden; }
.ldrawer__body::-webkit-scrollbar{ display:none; }

/* 서랍 안의 대여 카드 — 접객에서 생성되는 카드와 같은 형태 */
.loans__group{ overflow:hidden; }
.loans__k{
  font-family:var(--font-mono); font-size:9px; letter-spacing:.16em; color:var(--ink-dim);
  margin:10px 12px 7px; padding-bottom:5px; border-bottom:1px solid var(--line-metal);
}
.loans__none{ text-align:center; color:var(--ink-dim); font-size:12px; padding:34px 20px; line-height:1.7; }
.loans__rail{
  display:flex; gap:10px; overflow-x:auto; overflow-y:hidden;
  padding:0 12px 12px; scroll-padding-inline:12px;
  scroll-snap-type:x proximity; touch-action:pan-x; overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
}
.loans__rail::after{ content:''; flex:0 0 2px; }
.loans__rail::-webkit-scrollbar{ display:none; }

/* ══ [§css.page] 상점 · 개봉 — 각각 한 화면 ══
   서랍이 아니라 페이지다. 지도를 가리지 않고, 지도를 대신한다. */
.page{
  position:absolute; inset:0; z-index:25; display:flex; flex-direction:column;
  background:radial-gradient(ellipse at 50% -8%, #241c15 0%, var(--bg-void) 58%);
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.page.on{ opacity:1; pointer-events:auto; }
.page__top{
  flex-shrink:0; display:flex; align-items:center; gap:9px; padding:16px 16px 0;
}
.page__top .page__phase{ flex:1; }
.page__day{ font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; color:var(--ink-dim); }
.page__phase{ font-family:var(--font-display); font-size:22px; color:var(--ink); }
.page__sub{
  flex-shrink:0; padding:4px 16px 0; font-size:11px; color:var(--ink-dim); line-height:1.6;
}
.page__sub b{ color:var(--ink); font-weight:700; }
.page__body{ flex:1; overflow-y:auto; padding:14px 14px 6px; }
.page__body::-webkit-scrollbar{ display:none; }
.page__acts{ flex-shrink:0; padding:8px 14px 16px; display:flex; gap:9px; }
.page-back{
  width:100%; padding:11px 14px; border:1px solid var(--line-metal); border-radius:5px;
  background:var(--bg-card); color:var(--ink); font-family:var(--font-display); font-size:13px;
  cursor:pointer; transition:border-color .15s, background .15s;
}
.page-back:hover{ border-color:var(--grade-unique); background:#2c2219; }
.page__k{
  font-family:var(--font-mono); font-size:9px; letter-spacing:.18em; color:var(--ink-dim);
  margin:2px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line-metal);
}

/* ── 무기고 — 카드로 늘어놓는다 ──
   접객에서 건네는 것과 같은 물건이니 같은 얼굴이어야 한다. */
.armory{ margin:2px -14px 0; padding:0 14px; }
.armory__rail{
  display:flex; gap:9px; overflow-x:auto; padding:2px 0 4px;
  scroll-snap-type:x proximity;
}
.armory__rail::-webkit-scrollbar{ display:none; }

.gcard{
  flex:0 0 auto; width:112px; scroll-snap-align:start; cursor:pointer;
  background:var(--bg-card); border:1px solid var(--line-metal); border-radius:5px;
  overflow:hidden; box-shadow:0 5px 14px rgba(0,0,0,.45);
  transition:transform .16s, border-color .16s;
}
.gcard:hover{ border-color:var(--accent); transform:translateY(-2px); }
.gcard:active{ transform:translateY(0); }
.gcard__accent{ height:4px; background:var(--accent); }
.gcard--unique .gcard__accent{ animation:ember 2.6s ease-in-out infinite; }
.gcard__thumb{
  position:relative; height:74px; display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.gcard__thumb::before{
  content:''; position:absolute; width:104px; height:104px; border-radius:50%;
  background:var(--accent); opacity:.13; filter:blur(1px);
}
.gcard__thumb svg{
  width:52px; height:52px; color:var(--accent); position:relative; z-index:1;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.5));
}
.gcard__info{ padding:7px 9px 10px; text-align:center; }
.gcard__grade{ font-size:8.5px; color:var(--ink-dim); }
.gcard__name{ font-family:var(--font-display); font-size:12.5px; line-height:1.25; margin-top:1px; }
.gcard__atk{ font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--accent); margin-top:2px; }
.gcard__bar{ height:4px; border-radius:2px; background:rgba(255,255,255,.07); overflow:hidden; margin-top:6px; }
.gcard__bar i{ display:block; height:100%; border-radius:2px; }
.gcard__brit{ font-family:var(--font-mono); font-size:8.5px; color:var(--ink-dim); margin-top:5px; }
.gcard__brit b{ color:var(--dur-low); font-weight:700; }
.gcard__repair{
  width:calc(100% - 14px); margin:0 7px 8px; padding:7px 5px;
  border:1px solid var(--line-metal); border-radius:4px; background:rgba(0,0,0,.22);
  color:var(--ink); font-family:var(--font-mono); font-size:9px; cursor:pointer;
}
.gcard__repair:not(:disabled):hover{ border-color:var(--dur-high); }
.gcard__repair:disabled{ opacity:.38; cursor:default; }

.armory__empty{
  text-align:center; color:var(--ink-dim); font-size:11.5px; line-height:1.8;
  padding:22px 10px 16px; border:1px dashed var(--line-metal); border-radius:5px;
}

/* ── 재료 — 종류마다 다르게 쌓인다 ── */
.mats{ margin-top:4px; }
.mats__rail{ display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; }
.mats__rail::-webkit-scrollbar{ display:none; }
.mat{
  flex:0 0 auto; display:flex; align-items:center; gap:6px;
  padding:7px 10px 7px 8px; border-radius:4px;
  border:1px solid var(--line-metal); background:rgba(0,0,0,.2);
}
.mat__gem{
  width:12px; height:12px; background:var(--mc); flex-shrink:0;
  box-shadow:0 0 7px var(--mc);
}
/* 등급이 높을수록 모양이 복잡해진다 */
.mat__gem.tier1{ clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
.mat__gem.tier2{ clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%); }
.mat__gem.tier3{ clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%); }
.mat__n{ font-size:11px; color:var(--ink); white-space:nowrap; }
.mat__c{ font-family:var(--font-mono); font-weight:700; font-size:12px; color:var(--mc); }
.mats__none{ font-size:11.5px; color:var(--ink-dim); padding:10px 2px; }
.mats__note{ font-family:var(--font-mono); font-size:9.5px; color:var(--ink-dim); margin-top:9px; letter-spacing:.04em; }
.mats__note b{ color:var(--ink); font-weight:700; }

/* ── 상점의 세 공간 — 무기고, 제작소, 문열기 ── */
.shop-hub__intro{
  margin:2px 0 15px; padding:13px 14px; border-left:2px solid var(--grade-unique);
  background:rgba(201,150,63,.05); color:var(--ink-dim); font-size:11px; line-height:1.65;
}
.doors{ margin-top:24px; display:flex; flex-direction:column; gap:9px; }
.doors--hub{ margin-top:0; }
.door{
  display:flex; align-items:center; gap:12px; padding:14px 14px;
  background:var(--bg-card); border:1px solid var(--line-metal); border-radius:5px;
  cursor:pointer; transition:border-color .16s, transform .16s, background .16s;
}
.door:hover{ border-color:var(--grade-unique); background:#2c2219; }
.door:active{ transform:translateY(1px); }
.door__ico{ width:26px; height:26px; color:var(--ink-dim); flex-shrink:0; }
.door__ico svg{ width:100%; height:100%; }
.door:hover .door__ico{ color:var(--grade-unique); }
.door__txt{ flex:1; min-width:0; }
.door__t{ font-family:var(--font-display); font-size:15px; }
.door__s{ font-size:10.5px; color:var(--ink-dim); margin-top:2px; }
.door__go{ font-size:19px; color:var(--ink-dim); flex-shrink:0; }
.door--shut{ opacity:.42; pointer-events:none; }
.workshop-create{
  margin-top:18px; display:flex; align-items:center; gap:12px; width:100%; padding:14px;
  border:1px solid var(--grade-unique); border-radius:5px; background:#302318; color:var(--ink);
  cursor:pointer; text-align:left;
}
.workshop-create:disabled{ opacity:.38; border-color:var(--line-metal); cursor:default; }
.workshop-create__ico{ width:28px; height:28px; color:var(--grade-unique); flex-shrink:0; }
.workshop-create__ico svg{ width:100%; height:100%; }
.workshop-create__title{ display:block; font-family:var(--font-display); font-size:15px; }
.workshop-create__sub{ display:block; color:var(--ink-dim); font-size:10px; margin-top:2px; }

/* ── 제작소 — 재료 세 가지를 고른 뒤 벼린다 ── */
.forge-popup{
  position:absolute; inset:0; z-index:36; padding:18px 14px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(8,6,5,.82); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity .22s;
}
.forge-popup.on{ opacity:1; pointer-events:auto; }
.forge-popup__panel{
  width:100%; max-height:calc(100% - 16px); overflow-y:auto;
  background:linear-gradient(160deg,#2c231b,#1b1612);
  border:1px solid var(--line-metal); border-radius:8px;
  box-shadow:0 18px 50px rgba(0,0,0,.65);
  transform:translateY(12px) scale(.985); transition:transform .24s cubic-bezier(.34,1.25,.64,1);
}
.forge-popup.on .forge-popup__panel{ transform:none; }
.forge-popup__head{ display:flex; align-items:flex-start; gap:10px; padding:17px 16px 12px; }
.forge-popup__ico{ width:28px; height:28px; color:var(--grade-unique); flex-shrink:0; }
.forge-popup__ico svg{ width:100%; height:100%; }
.forge-popup__title{ font-family:var(--font-display); font-size:18px; }
.forge-popup__sub{ font-size:10.5px; color:var(--ink-dim); margin-top:3px; line-height:1.45; }
.forge-popup__close{
  margin-left:auto; width:30px; height:30px; border:0; border-radius:4px;
  background:rgba(255,255,255,.04); color:var(--ink-dim); font-size:20px; cursor:pointer;
}
.forge-slots{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:0 16px 14px; }
.forge-slot{
  min-width:0; height:65px; border:1px dashed var(--line-metal); border-radius:5px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  color:var(--ink-dim); background:rgba(0,0,0,.16); cursor:default;
}
.forge-slot.filled{ border-style:solid; border-color:var(--mc); color:var(--ink); cursor:pointer; }
.forge-slot__gem{ width:16px; height:16px; background:var(--mc); box-shadow:0 0 8px var(--mc); }
.forge-slot__gem.tier1{ clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
.forge-slot__gem.tier2{ clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%); }
.forge-slot__gem.tier3{ clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%); }
.forge-slot__name{ max-width:100%; padding:0 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; }
.forge-slot__num{ font-family:var(--font-mono); font-size:9px; }
.forge-popup__k{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.14em; color:var(--ink-dim); padding:0 16px 7px; }
.forge-materials{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; padding:0 16px 16px; }
.forge-mat{
  position:relative; display:flex; align-items:center; gap:8px; min-width:0;
  padding:10px 9px; border:1px solid var(--line-metal); border-radius:5px;
  background:rgba(0,0,0,.2); color:var(--ink); cursor:pointer;
  transition:border-color .15s, background .15s, transform .15s;
}
.forge-mat:active{ transform:scale(.98); }
.forge-mat.selected{ border-color:var(--mc); background:rgba(255,255,255,.035); }
.forge-mat.exhausted{ opacity:.38; pointer-events:none; }
.forge-mat__gem{ width:16px; height:16px; flex-shrink:0; background:var(--mc); box-shadow:0 0 8px var(--mc); }
.forge-mat__gem.tier1{ clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
.forge-mat__gem.tier2{ clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%); }
.forge-mat__gem.tier3{ clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%); }
.forge-mat__txt{ min-width:0; }
.forge-mat__name{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; }
.forge-mat__left{ display:block; font-family:var(--font-mono); font-size:8.5px; color:var(--ink-dim); margin-top:2px; }
.forge-mat__picked{
  margin-left:auto; min-width:20px; height:20px; border-radius:10px; padding:0 5px;
  display:flex; align-items:center; justify-content:center;
  background:var(--mc); color:#17120e; font-family:var(--font-mono); font-size:10px; font-weight:700;
}
.forge-popup__foot{ border-top:1px solid var(--line-metal); padding:12px 16px 16px; }
.forge-start{
  width:100%; padding:12px 14px; border:1px solid var(--grade-unique); border-radius:5px;
  background:#3a2a1d; color:var(--ink); font-family:var(--font-display); font-size:15px; cursor:pointer;
}
.forge-start:disabled{ opacity:.35; border-color:var(--line-metal); cursor:default; }
.forge-start__note{ text-align:center; font-size:9.5px; color:var(--ink-dim); margin-top:7px; }

/* ══ [§css.night] 개봉 — open_night 원본 ══ */
.reveal{
  position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; z-index:1000;
  display:flex; flex-direction:column;
  background:radial-gradient(ellipse at 50% 8%, #221c17 0%, rgba(10,8,7,.98) 62%);
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.reveal.on{ opacity:1; pointer-events:auto; }
.night__top{ padding:calc(18px + env(safe-area-inset-top)) 16px 6px; flex-shrink:0; text-align:center; }
.night__day{ font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; color:var(--ink-dim); text-transform:uppercase; }
.night__queue{ display:flex; justify-content:center; gap:6px; margin-top:9px; }
.night__queue span{ width:7px; height:7px; border-radius:50%; background:rgba(233,221,198,.14); }
.night__queue span.on{ background:var(--ink-dim); }
.night__queue span.alive{ background:var(--dur-high); }
.night__queue span.dead{ background:var(--dur-low); }
.night__stage{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; }
.night__hints{ flex-shrink:0; padding:6px 16px calc(20px + env(safe-area-inset-bottom)); text-align:center; }
.night__hint{
  display:inline-block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; color:var(--ink-dim);
  background:var(--bg-card); border:1px solid var(--line-metal); border-radius:3px; padding:5px 10px;
}
.night__counter{ font-family:var(--font-mono); font-size:10px; color:var(--ink-dim); margin-top:9px; letter-spacing:.08em; }

/* ── 봉투 ── */
.env{
  position:absolute; width:250px; height:168px;
  cursor:pointer; user-select:none;
  transition:transform .45s cubic-bezier(.34,1.4,.64,1), opacity .4s;
}
.env__body{
  position:absolute; inset:0;
  background:linear-gradient(160deg, #2f2820 0%, #241e18 100%);
  border:1px solid var(--line-metal); border-radius:4px;
  box-shadow:0 10px 26px rgba(0,0,0,.6);
  overflow:hidden;
}
/* 겉면은 전부 같은 색 — 뜯기 전엔 알 수 없다 */
.env__flap{
  position:absolute; left:0; right:0; top:0; height:84px;
  background:linear-gradient(175deg, #362d24 0%, #2a231c 100%);
  border-bottom:1px solid var(--line-metal);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  transform-origin:50% 0%;
  transition:transform .5s cubic-bezier(.5,.05,.4,1), filter .5s;
  z-index:3;
}
.env.opened .env__flap{ transform:rotateX(-168deg); filter:brightness(.7); }
.env__seal{
  position:absolute; left:50%; top:56px; transform:translate(-50%,-50%) rotate(-6deg);
  width:34px; height:34px; border-radius:50%;
  border:1.6px solid var(--stamp-ink); color:var(--stamp-ink);
  background:rgba(18,15,13,.6);
  font-family:var(--font-display); font-size:12px;
  display:flex; align-items:center; justify-content:center; z-index:4;
  transition:opacity .3s;
}
.env.opened .env__seal{ opacity:0; }
.env__label{ position:absolute; left:0; right:0; bottom:16px; text-align:center; z-index:2; }
.env__dest{ font-family:var(--font-display); font-size:16px; color:var(--ink); }
.env__who{ font-size:10.5px; color:var(--ink-dim); margin-top:3px; }
.env__hint{
  position:absolute; left:0; right:0; bottom:-22px; text-align:center;
  font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; color:var(--ink-dim);
}
/* 뜯는 순간 드러나는 안쪽 색 */
.env__inner{
  position:absolute; left:0; right:0; top:0; height:96px;
  opacity:0; transition:opacity .35s ease .18s; z-index:1;
}
.env.opened .env__inner{ opacity:1; }
.env__inner.alive{ background:linear-gradient(180deg, rgba(122,155,118,.42) 0%, transparent 100%); }
.env__inner.dead{  background:linear-gradient(180deg, rgba(156,63,38,.5) 0%, transparent 100%); }
.env.gone{ transform:translateY(-40px) scale(.9); opacity:0; }
.env.enter{ animation:envIn .42s cubic-bezier(.34,1.4,.64,1); }
@keyframes envIn{ from{ transform:translateY(26px) scale(.94); opacity:0; } to{ transform:none; opacity:1; } }
.env.tearing{ animation:tear .22s ease-in-out; }
@keyframes tear{ 0%,100%{ transform:translateX(0);} 30%{ transform:translateX(-4px) rotate(-.6deg);} 70%{ transform:translateX(3px) rotate(.5deg);} }

/* ── 결과 카드 ── */
.result{
  position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; z-index:1010;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  background:rgba(10,8,7,0);
  opacity:0; pointer-events:none; transition:opacity .3s, background .3s;
}
.result.show{ opacity:1; pointer-events:auto; background:rgba(10,8,7,.72); }
.rcard{
  width:212px; background:var(--bg-card);
  border:1px solid var(--line-metal); border-radius:5px;
  box-shadow:0 16px 40px rgba(0,0,0,.66);
  overflow:hidden; position:relative;
  transform:scale(.85); opacity:0;
  transition:transform .4s cubic-bezier(.34,1.5,.64,1), opacity .3s;
}
.result.show .rcard{ transform:scale(1); opacity:1; }
.rcard__verdict{
  padding:9px 12px 8px; text-align:center;
  font-family:var(--font-display); font-size:14px;
  border-bottom:1px solid var(--line-metal);
}
.rcard__verdict.alive{ color:var(--dur-high); background:rgba(122,155,118,.1); }
.rcard__verdict.dead{  color:var(--dur-low);  background:rgba(156,63,38,.14); }
.rcard__half{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:5px; padding:15px 12px; }
.rcard__weaponwrap{ position:relative; }
.rcard__ico{ width:48px; height:48px; }
.rcard__name{ font-family:var(--font-display); font-size:17px; }
.rcard__sub{ font-size:10px; color:var(--ink-dim); margin-top:2px; }
.rcard__num{ font-family:var(--font-mono); font-weight:700; font-size:16px; margin-top:3px; }
.rseam{ display:block; width:100%; height:11px; }
.rseam path{ stroke:var(--line-metal); stroke-width:1.4; fill:none; }
.rcard__foot{
  font-size:10.5px; color:var(--ink-dim); text-align:center;
  padding:8px 10px 11px; border-top:1px dashed var(--line-metal); line-height:1.55;
}
.rcard__foot b{ color:var(--ink); font-weight:700; }
.rcard__foot.warn b{ color:var(--dur-low); }

/* 내구도 — 닳은 만큼이 눈에 보이게 깎여나간다 */
.rcard__wear{ padding:9px 13px 12px; border-top:1px dashed var(--line-metal); }
.wear__bar{ position:relative; height:8px; border-radius:4px; background:rgba(255,255,255,.06); overflow:hidden; }
.wear__fill{ position:absolute; left:0; top:0; bottom:0; border-radius:4px;
  transition:width 1s cubic-bezier(.4,0,.3,1) .35s; }
/* 파손과 같은 붉은색을 쓰지 않는다 — "잃음"과 "깨짐"은 다른 색이어야 한다 */
.wear__lost{
  position:absolute; top:0; bottom:0; border-radius:4px;
  background:repeating-linear-gradient(45deg, rgba(233,221,198,.16) 0 4px, rgba(233,221,198,.06) 4px 8px);
  transition:opacity .6s ease, transform .6s cubic-bezier(.4,0,.3,1); transform-origin:left center;
}
.wear__lost.fade{ opacity:0; transform:scaleX(.6); }
.wear__row{ display:flex; justify-content:space-between; align-items:baseline; margin-top:7px; }
.wear__k{ font-size:10px; color:var(--ink-dim); }
.wear__v{ font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); }
.wear__v b{ font-size:14px; color:var(--ink); }
.wear__drop{
  text-align:right; font-family:var(--font-mono); font-weight:700; font-size:12px;
  color:var(--dur-low); margin-top:2px; opacity:0; transform:translateY(-4px);
}
.wear__drop.show{ animation:dropIn 1.1s cubic-bezier(.34,1.4,.64,1) forwards; }
@keyframes dropIn{
  0%{ opacity:0; transform:translateY(-6px); }
  22%{ opacity:1; transform:translateY(0); }
  75%{ opacity:1; transform:translateY(0); }
  100%{ opacity:.45; transform:translateY(3px); }
}

/* 용사의 죽음 — 사라지지 않는다. 그 사람다움(고유색)만 빠져나간다. */
.rcard__half--hero .rcard__ico{ transition:color 1.4s ease, filter 1.4s ease; }
.rcard.lost .rcard__half--hero .rcard__ico{ animation:heroDrain 1.6s cubic-bezier(.4,0,.6,1) .1s forwards; }
@keyframes heroDrain{
  0%{ filter:saturate(1) brightness(1); }
  30%{ filter:saturate(.45) brightness(.85); }
  100%{ filter:saturate(0) brightness(.62); }
}
.rcard.lost .rcard__half--hero .rcard__name{ animation:heroNameDrain 1.6s ease .1s forwards; }
@keyframes heroNameDrain{ 0%{ color:var(--ink); } 100%{ color:var(--ink-dim); } }
/* 이름 아래 조용한 한 줄 — 도장도 효과음도 없이 */
.rcard__gone{
  font-family:var(--font-mono); font-size:8.5px; letter-spacing:.14em;
  color:var(--ink-dim); opacity:0; margin-top:4px;
}
.rcard.lost .rcard__gone{ animation:goneIn 1s ease-out 1.1s forwards; }
@keyframes goneIn{ to{ opacity:.55; } }

/* 무기의 소멸 — 용사와 같은 문법. 형태는 남고 색만 빠져나간다. */
.rcard__half--weapon{ position:relative; }
.rcard__half--weapon .rcard__ico{ transition:color 1.4s ease, filter 1.4s ease; }
.rcard.lost .rcard__half--weapon .rcard__ico{ animation:heroDrain 1.6s cubic-bezier(.4,0,.6,1) .1s forwards; }
.rcard.lost .rcard__half--weapon .rcard__name{ animation:heroNameDrain 1.6s ease .1s forwards; }
.rcard.lost .rcard__half--weapon .rcard__num{ animation:heroNameDrain 1.6s ease .1s forwards; }

/* 파손 — 무기에만 일어난다. 용사 쪽은 움직이지 않는다. */
.rcard.broken{ overflow:visible; }
.rcard.broken .rcard__weaponwrap{
  animation:shatterShake .5s cubic-bezier(.36,.07,.19,.97) .3s; overflow:visible;
}
@keyframes shatterShake{
  0%{ transform:scale(1) translate(0,0); }
  12%{ transform:scale(1.05) translate(0,-3px); }
  24%{ transform:scale(1) translate(-6px,2px) rotate(-1.6deg); }
  38%{ transform:scale(1) translate(5px,-1px) rotate(1.2deg); }
  54%{ transform:scale(1) translate(-4px,2px) rotate(-.8deg); }
  70%{ transform:scale(1) translate(2px,1px) rotate(.5deg); }
  100%{ transform:scale(1) translate(0,0); }
}
/* 균열선 — 무기 블록 안에서만 그어진다 */
.rcard__crackline{ position:absolute; inset:0; z-index:6; pointer-events:none; opacity:0; }
.rcard.broken .rcard__crackline{ animation:crackFlash 1.1s ease-out forwards; }
.rcard__crackline path{
  stroke:#ffb27a; stroke-width:2.6; fill:none;
  filter:drop-shadow(0 0 6px rgba(255,140,70,.95)) drop-shadow(0 0 14px rgba(207,91,46,.7));
  stroke-dasharray:220; stroke-dashoffset:220;
}
.rcard.broken .rcard__crackline path{ animation:crackDraw .3s cubic-bezier(.5,0,.4,1) forwards; }
@keyframes crackDraw{ to{ stroke-dashoffset:0; } }
@keyframes crackFlash{ 0%{ opacity:0; } 8%{ opacity:1; } 70%{ opacity:1; } 100%{ opacity:.35; } }
/* 무기 아이콘·이름이 둘로 갈라져 어긋난다 */
.rcard.broken .rcard__piece--r{ animation:splitR 1.05s cubic-bezier(.3,.5,.2,1) .42s forwards; }
@keyframes splitR{
  0%{ transform:none; }
  18%{ transform:translate(3px,-2px) rotate(1deg); }
  100%{ transform:translate(14px,16px) rotate(6deg); opacity:.5; }
}
.shard{
  position:absolute; left:50%; top:50%; z-index:7; pointer-events:none;
  width:7px; height:9px; background:var(--ink-dim);
  clip-path:polygon(50% 0, 100% 62%, 62% 100%, 6% 74%); opacity:0;
}
.rcard.broken .shard{ animation:shardFly .95s cubic-bezier(.2,.6,.3,1) .38s forwards; }
@keyframes shardFly{
  0%{ opacity:1; transform:translate(0,0) rotate(0deg) scale(1); }
  100%{ opacity:0; transform:translate(var(--sx),var(--sy)) rotate(var(--sr)) scale(.4); }
}
.rcard__flash{
  position:absolute; inset:0; z-index:8; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(255,214,170,.92) 0%, rgba(207,91,46,.35) 40%, transparent 70%);
  opacity:0;
}
.rcard.broken .rcard__flash{ animation:breakFlash .5s ease-out .3s; }
@keyframes breakFlash{ 0%{ opacity:0; } 14%{ opacity:1; } 100%{ opacity:0; } }

.result__msg{

.night-summary{

/* ── 봉투 트레이 — 뜯는 순서는 당신이 정한다 ── */
.tray{ display:flex; flex-direction:column; gap:10px; }
.sealed{
  position:relative; cursor:pointer; overflow:hidden;
  background:linear-gradient(160deg, #2f2820 0%, #241e18 100%);
  border:1px solid var(--line-metal); border-radius:4px;
  padding:14px 14px 13px 52px; min-height:66px;
  box-shadow:0 5px 14px rgba(0,0,0,.45);
  transition:border-color .16s, transform .16s, opacity .3s;
}
.sealed:hover{ border-color:var(--grade-unique); transform:translateY(-2px); }
.sealed__flap{
  position:absolute; left:0; top:0; width:44px; height:100%;
  background:linear-gradient(175deg, #362d24 0%, #2a231c 100%);
  border-right:1px solid var(--line-metal);
  clip-path:polygon(0 0, 100% 0, 62% 50%, 100% 100%, 0 100%);
}
.sealed__wax{
  position:absolute; left:22px; top:50%; transform:translate(-50%,-50%) rotate(-6deg);
  width:26px; height:26px; border-radius:50%; z-index:2;

  background:rgba(18,15,13,.72);

  display:flex; align-items:center; justify-content:center;

.sealed__dest{ font-family:var(--font-display); font-size:14px; color:var(--ink); }
.sealed__who{ font-size:10.5px; color:var(--ink-dim); margin-top:3px; }
.sealed__ago{ font-family:var(--font-mono); font-size:9px; color:var(--ink-dim); margin-top:4px; letter-spacing:.04em; }
.sealed.opened{ opacity:.3; pointer-events:none; }

/* 던전 상세 시트 */
.sheet{
  position:absolute; inset:0; z-index:28; background:rgba(10,8,7,.72);
  display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .3s;
}

.sheet__panel{
  width:100%; background:var(--bg-card); border-top:1px solid var(--line-metal);

  transform:translateY(100%); transition:transform .4s cubic-bezier(.4,.15,.2,1);
}

.sheet__title{ font-family:var(--font-display); font-size:19px; color:var(--accent); }
.sheet__turn{ font-family:var(--font-mono); font-size:10px; color:var(--ink-dim); margin-top:3px; letter-spacing:.08em; }
.sheet__k{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.14em; color:var(--ink-dim); margin:14px 0 5px; }
.sheet__rumor{ font-size:11.5px; font-style:italic; line-height:1.65; }
.sheet__log{ font-size:10.5px; color:var(--ink-dim); line-height:1.75; }
.sheet__log b{ color:var(--dur-low); font-weight:700; }
.sheet__none{ font-size:11px; color:var(--ink-dim); }

.toast{
  position:absolute; left:50%; bottom:180px; transform:translate(-50%,10px);
  background:rgba(20,16,13,.96); border:1px solid var(--line-metal); border-radius:4px;
  padding:8px 14px; font-size:11px; color:var(--ink); z-index:20;
  opacity:0; pointer-events:none; transition:.28s;
}
.toast.on{ opacity:1; transform:translate(-50%,0); }
</style>
</head>

<script>
/* ═══════════════════════════════════════════
   던전 지도 프로토타입
   원칙: 지도는 "어디쯤"만 말한다. "어떤지"는 절대 말하지 않는다.
   ═══════════════════════════════════════════ */

const $ = id => document.getElementById(id);

/* ── 의사난수 (카드 균열선 시드) ── */
/* ═══ [§ui.rand] 시드 난수 · 균열선 ═══ */
function mulberry32(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedOf(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0; return h; }
function crackSVG(id, w, cls){
  cls = cls || 'crack';
  const rand=mulberry32(seedOf(id)), segs=6, step=w/segs;
  let d=`M0,${(4+rand()*2).toFixed(1)}`;
  for(let i=1;i<=segs;i++) d+=` L${(step*i).toFixed(1)},${(4+(rand()*5-2.5)).toFixed(1)}`;
  return `<svg class="${cls}" viewBox="0 0 ${w} 9" preserveAspectRatio="none"><path d="${d}"/></svg>`;
}

/* ── 아이콘 ── */
/* ═══ [§ui.icon] 아이콘 · 실루엣 ═══ */
const ICON = {

  loan:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">

    <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>`,

  dungeon:`<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 52 V30 Q30 6 52 30 V52"/><path d="M22 52 V38 Q30 28 38 38 V52"/></svg>`,

/* 던전별 고유 실루엣 — 이름만 다른 구멍이 되지 않게 */
const DICON = {
  '폐광': `<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">

    <path d="M12 21 V9"/><path d="M12 9 L20 6 L12 3"/><path d="M8 21 H16"/></svg>`;

/* 무기 실루엣 — forge가 뽑아낸 외곽선 자리. 종류별로 다른 형태. */
const WSIL = {
  '도':  `<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 5 Q37 16 36 34 L31 43 L28 34 L28 12 Z"/><path d="M20 43 H40"/><path d="M30 43 V55"/></svg>`,

/* ═══ [§core.dungeons] 던전 데이터 ═══
   §11 판단 축. 요구치(need)는 어디에도 노출하지 않는다.
   keys  — 이 던전을 가리키는 키워드. 살아 돌아온 자만 하나씩 물고 온다.
   일부는 일부러 겹친다. 겹쳐야 조합으로 좁히게 된다.
   다만 던전마다 배타적 키워드가 최소 하나는 있어야 확정이 가능하다. */
const DUNGEONS = {
  '폐광':       { turns:1, accent:'var(--attr-none)',  need:50,  lane:0, axis:'기준선',
                  keys:['좁음','어두움','썩은 나무','고인 물'],
                  hint:'나무 냄새가 난다더군',
                  lines:{

                    '썩은 나무':['"버팀목이 삭아서 손만 대도 부스러진다지."','"나무 썩는 냄새가 배어 있대."'],
                    '고인 물':['"발목까지 물이 찬 데가 있다더군."','"물소리가 계속 들린다지."']
                  },
                  loot:['무쇠','강철'], unlocked:true, sent:0, lost:0, log:[],
                  known:new Set(), lootKnown:new Set() },

  '화룡 소굴':  { turns:2, accent:'var(--attr-fire)',  need:88,  lane:1, axis:'속성',
                  keys:['좁음','뜨거움','유황','외길'],
                  hint:'숨이 막힌다더군',
                  lines:{

function dungeonName(name){
  const D = DUNGEONS[name];
  if(!D) return name;

/* ═══ [§core.outcome] 생환 판정 — 내보내는 순간 확정되고, 뜯기 전까지 어디에도 드러나지 않는다 ═══ */
function rollOutcome(hero, wp, dName){
  const D = DUNGEONS[dName];
  const power = wp.atk * (1 + hero.skill/100);
  const r = (power - D.need) / D.need;
  let surv = power >= D.need ? 50 + 38*(1 - Math.exp(-3.0*r)) : 50*Math.exp(2.0*r);
  surv = Math.max(5, Math.min(88, surv));
  const alive = Math.random()*100 < surv;
  if(!alive) return { kind:'dead', surv };
  const dispoK = hero.dispo==='무모'?1.3:hero.dispo==='신중'?0.78:1.0;
  const wear = Math.round((10 + D.turns*6) * dispoK);
  const broke = (wp.dur - wear) <= 0 || Math.random()*100 < wp.brit;
  return { kind: broke ? 'broken' : 'alive', wear, surv };
}
function reactionOf(hero, wp, dName){
  const p = wp.atk * (1 + hero.skill/100) / DUNGEONS[dName].need;
  return p >= 1.55 ? { l:'받아들임', c:'var(--dur-high)' }
       : p >= 1.05 ? { l:'망설임',   c:'var(--dur-mid)'  }
                   : { l:'불만',     c:'var(--dur-low)'  };
}

function heroSpeech(h){
  const D = DUNGEONS[h.dest];
  const known = D.keys.filter(k=>D.known.has(k));
  const pool = known.length ? known : D.keys;
  const r = mulberry32(seedOf(h.name + h.dest + S.day));
  const pick = pool[Math.floor(r()*pool.length)];
  const cand = D.lines[pick];
  return {
    clue: cand[Math.floor(r()*cand.length)],
    tail: TAIL[h.dispo][Math.floor(r()*TAIL[h.dispo].length)],
    keyword: pick
  };
}
function moodOf(h, w){
  const p = w.atk * (1 + h.skill/100) / DUNGEONS[h.dest].need;
  return p >= 1.55 ? 'good' : p >= 1.05 ? 'mid' : 'bad';
}

let heroWinMM=null, heroWinMU=null;
function bindHeroDrag(){
  if(heroWinMM) window.removeEventListener('mousemove', heroWinMM);

  const hc = $('heroCard'); if(!hc) return;
  const mark = hc.querySelector('[data-send]');

  const start=(x,y)=>{ if(G.locked) return; on=true; ax=x; ay=y; adx=0; ady=0; moved=false; hc.classList.add('dragging'); };
  const move=(x,y)=>{
    if(!on) return;
    adx=x-ax; ady=y-ay;
    if(Math.abs(adx)>6 || Math.abs(ady)>6) moved=true;
    hc.style.transform=`translate(${adx*0.2}px, ${ady}px) rotate(${adx*0.02}deg)`;
    mark.style.opacity = ady<-30 ? Math.min(1,(-ady-30)/56) : 0;
  };

    if(!moved){ hc.style.transform=''; mark.style.opacity=0; openHeroDetail(G.heroes[G.idx]); return; }
    if(ady < -Math.max(56, hc.getBoundingClientRect().height * 0.49)){ doSendAway(); return; }
    hc.style.transform=''; mark.style.opacity=0;
  };
  hc.addEventListener('touchstart', e=>start(e.touches[0].clientX,e.touches[0].clientY), {passive:true});
  hc.addEventListener('touchmove',  e=>move(e.touches[0].clientX,e.touches[0].clientY), {passive:true});
  hc.addEventListener('touchend', end);
  hc.addEventListener('mousedown', e=>{ e.preventDefault(); start(e.clientX,e.clientY); });
  heroWinMM=e=>move(e.clientX,e.clientY); heroWinMU=end;
  window.addEventListener('mousemove', heroWinMM);
  window.addEventListener('mouseup', heroWinMU);
}

function renderRail(dir){
  const rail = $('rail'); if(!rail) return;

    rail.innerHTML = `<div class="greet__empty">내어줄 것이 하나도 없다.<br>빈손으로 돌려보내는 것도 결정이다.</div>`;

  }

  if(n > 1){ const p = makeCard(S.stock[(G.cursor-1+n)%n]); p.classList.add('wcard--side','prev'); rail.appendChild(p); }

  const w = S.stock[G.cursor];

/* 양옆 카드가 밀리는 거리 = 카드 폭 × 0.763 (원본 186 → 142) */
function syncSideOffset(){
  const rail = $('rail'); if(!rail || !G.card) return;
  const w = G.card.getBoundingClientRect().width || 186;
  rail.style.setProperty('--side', (w * 0.763).toFixed(1) + 'px');
}
function sideOffset(){
  const v = parseFloat(getComputedStyle($('rail')).getPropertyValue('--side'));
  return isNaN(v) ? 142 : v;
}

/* 스와이프 임계치도 카드 폭에 비례해야 한다 — 작은 화면에서 더 멀리 끌게 되면 안 된다 */
function stepPx(){ return Math.max(58, (G.card ? G.card.getBoundingClientRect().width : 186) * 0.47); }
function givePx(){ return Math.max(52, (G.card ? G.card.getBoundingClientRect().height : 270) * 0.28); }
let wDragging=false, wOriginX=0, wOriginY=0, wLastStepX=0, wLastY=0, wMoved=false;
let wWinMM=null, wWinMU=null;

function bindWeaponDrag(){
  const c = G.card; if(!c) return;
  c.addEventListener('touchstart', e=>{ if(G.locked) return; wStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  c.addEventListener('touchmove',  e=>wMove(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  c.addEventListener('touchend', wEnd);
  c.addEventListener('mousedown', e=>{ if(G.locked) return; e.preventDefault(); wStart(e.clientX, e.clientY); });
  if(wWinMM) window.removeEventListener('mousemove', wWinMM);
  if(wWinMU) window.removeEventListener('mouseup', wWinMU);
  wWinMM = e=>wMove(e.clientX, e.clientY); wWinMU = wEnd;
  window.addEventListener('mousemove', wWinMM);
  window.addEventListener('mouseup', wWinMU);
}
function wStart(x,y){
  wDragging=true; wOriginX=x; wOriginY=y; wLastStepX=x; wLastY=y; wMoved=false;
  G.card.classList.add('dragging');
}
function wMove(x,y){
  if(!wDragging || !G.card) return;
  wLastY=y;
  const totalDY = y-wOriginY;
  if(Math.abs(x-wOriginX)>6 || Math.abs(totalDY)>6) wMoved=true;

  let stepDX = x-wLastStepX;
  const STEP = stepPx();
  // 임계치를 넘을 때마다 계속 다음 카드로 — 손을 떼지 않아도 훑어 넘어간다
  if(stepDX <= -STEP){ G.cursor=(G.cursor+1)%S.stock.length; renderRail(); G.card.classList.add('dragging'); wLastStepX=x; stepDX=0; }
  else if(stepDX >= STEP){ G.cursor=(G.cursor-1+S.stock.length)%S.stock.length; renderRail(); G.card.classList.add('dragging'); wLastStepX=x; stepDX=0; }

  G.card.style.transform=`translate(${stepDX}px, ${totalDY}px) rotate(${stepDX*0.06}deg)`;
  const off = sideOffset();
  const prev=$('rail').querySelector('.wcard--side.prev');
  const next=$('rail').querySelector('.wcard--side.next');
  if(prev) prev.style.transform=`translateX(${-off+stepDX*0.32}px) scale(.84) rotate(-4deg)`;
  if(next) next.style.transform=`translateX(${ off+stepDX*0.32}px) scale(.84) rotate( 4deg)`;
  const giveEl=G.card.querySelector('[data-give]');
  if(giveEl) giveEl.style.opacity = totalDY<-30 ? Math.min(1,(-totalDY-30)/60) : 0;
}
function wEnd(){
  if(!wDragging || !G.card) return;
  wDragging=false; G.card.classList.remove('dragging');
  const totalDY = wLastY-wOriginY;
  if(!wMoved){ G.card.style.transform=''; resetSides(); openWeaponDetail(S.stock[G.cursor]); return; }
  if(totalDY < -givePx()){ doGive(); return; }
  G.card.style.transform=''; resetSides();
  const giveEl=G.card.querySelector('[data-give]');
  if(giveEl) giveEl.style.opacity=0;
}
function resetSides(){
  const prev=$('rail').querySelector('.wcard--side.prev');
  const next=$('rail').querySelector('.wcard--side.next');
  if(prev) prev.style.transform='';
  if(next) next.style.transform='';
}

/* ── 건넨다 — 두 장이 합쳐진다 ── */
function doGive(){
  G.locked = true;
  const w = S.stock[G.cursor], h = G.heroes[G.idx];
  const card = G.card;
  const phone = document.querySelector('.phone');
  const hc = $('heroCard');
  const dlg = $('bubble');
  const mood = moodOf(h, w);
  const react = reactionOf(h, w, h.dest);

  // 건네는 순간 대여가 확정된다 — 지도는 곧바로 그 사실을 안다
  S.pending.push({ hero:h, weapon:w, dungeon:h.dest, react, said: h._sp ? h._sp.clue : '' });
  renderLoansDrawer();

  if(dlg){ dlg.style.transition='opacity .16s ease'; dlg.style.opacity='0'; dlg.style.pointerEvents='none'; }

  // 도착 지점은 오직 하나 — 용사 카드의 위치
  const pr = phone.getBoundingClientRect();
  const hr = hc.getBoundingClientRect();
  const targetCX = hr.left+hr.width/2, targetCY = hr.top+hr.height/2;
  const targetLocalX = targetCX-pr.left, targetLocalY = targetCY-pr.top;

  $('rail').querySelectorAll('.wcard--side').forEach(s=>{
    s.style.transition='transform .3s ease, opacity .3s ease'; s.style.opacity='0';
  });

  // 1) 윈드업 — 제자리로 돌아가며 살짝 부푼다
  card.style.transition='transform .15s cubic-bezier(.4,0,.7,.2)';
  card.style.transform='scale(1.05)';

  // 2) 윈드업이 끝난 뒤 다시 재고 튕겨나간다.
  //    드래그로 밀린 상태에서 재면 그만큼 도착점이 어긋난다.
  setTimeout(()=>{
    const rest = card.getBoundingClientRect();
    const tx = targetCX - (rest.left + rest.width/2);
    const ty = targetCY - (rest.top  + rest.height/2);
    card.style.transition='transform .42s cubic-bezier(.3,1.6,.5,1)';
    card.style.transform=`translate(${tx}px, ${ty}px) scale(.62)`;
  }, 170);

  hc.style.transition='transform .3s ease, opacity .18s ease';
  setTimeout(()=>{
    hc.style.transform='scale(.94)';
    setTimeout(()=>{ hc.style.transform=''; }, 130);
  }, 510);

  // 3) 두 장이 합쳐져 대여 카드로 떠오른다
  setTimeout(()=>{
    $('rail').innerHTML=''; G.card=null;
    hc.style.opacity='0';

    const overlay=$('mergeOverlay'), wrap=$('mergeCardWrap'), bubble=$('mergeBubble');
    bubble.classList.remove('show'); bubble.removeAttribute('style');
    bubble.className=`merge-bubble ${mood}`;
    $('mergeMood').textContent = MOOD_LABEL[mood];
    $('mergeLine').textContent = MOOD_LINE[mood][(G.idx + S.day) % MOOD_LINE[mood].length];

    wrap.innerHTML=''; wrap.appendChild(makeLoanCard(h, w, true));

    const wrapW=wrap.offsetWidth, wrapH=wrap.offsetHeight;
    const prNow=phone.getBoundingClientRect();
    const bubbleH=bubble.offsetHeight || 56;
    const PAD=16, GAP=14;
    let cardTop = targetLocalY - wrapH/2;
    const maxTop = prNow.height - PAD - bubbleH - GAP - wrapH;
    cardTop = Math.max(PAD, Math.min(cardTop, Math.max(PAD, maxTop)));
    let cardLeft = Math.max(PAD, Math.min(targetLocalX - wrapW/2, prNow.width - PAD - wrapW));

    wrap.style.position='absolute'; wrap.style.left=cardLeft+'px';
    wrap.style.top=cardTop+'px'; wrap.style.margin='0';
    bubble.style.left=(cardLeft + wrapW/2)+'px';
    bubble.style.top =(cardTop + wrapH)+'px';

    overlay.classList.add('show');
    requestAnimationFrame(()=>bubble.classList.add('show'));
    setTimeout(()=>closeMergeToMap(h, w, react), 1450);
  }, 630);

  S.stock = S.stock.filter(x=>x.id !== w.id);
  setTimeout(nextHero, 2660);
}

/* 대여 카드는 지도로 간다 — 저녁에 저 길 위로 올라갈 것이다 */
function closeMergeToMap(h, w, react){
  const overlay=$('mergeOverlay'), wrap=$('mergeCardWrap'), bubble=$('mergeBubble');
  const phone=document.querySelector('.phone');
  const pr=phone.getBoundingClientRect();
  const wr=wrap.getBoundingClientRect();
  const btn=$('mapBtn');
  const bRect=btn.getBoundingClientRect();

  bubble.style.transition='opacity .2s ease, transform .2s ease';
  bubble.style.transform='translate(-50%, 24px) scale(.94)';
  bubble.style.opacity='0';

  overlay.style.background='rgba(10,8,7,0)';
  wrap.style.position='absolute';
  wrap.style.left=(wr.left-pr.left)+'px';
  wrap.style.top=(wr.top-pr.top)+'px';
  wrap.style.margin='0';
  wrap.style.transition='transform .5s cubic-bezier(.4,.15,.2,1), opacity .5s';
  requestAnimationFrame(()=>{
    const dx=(bRect.left+bRect.width/2)-(wr.left+wr.width/2);
    const dy=(bRect.top +bRect.height/2)-(wr.top +wr.height/2);
    wrap.style.transform=`translate(${dx}px, ${dy}px) scale(.2) rotate(-4deg)`;
    wrap.style.opacity='0';
  });

  setTimeout(()=>{
    overlay.classList.remove('show'); overlay.style.background='';
    wrap.innerHTML=''; wrap.removeAttribute('style'); bubble.removeAttribute('style');
  }, 560);
}

function makeLoanCard(h, w, big){
  const el = document.createElement('div');
  el.innerHTML = loanCardHTML({
    hero:h, weapon:w, said:h._sp ? h._sp.clue : '', state:'pending'
  }, { big });
  return el.firstElementChild;
}

let closingShown = false;

function showClosingScreen(){
  if(closingShown || S.phase === 'closing') return;
  closingShown = true;
  S.phase = 'closing';
  G.locked = true;
  $('talk').classList.remove('show');
  $('greet').classList.remove('on','peek');
  showPage(false);

  const allRented = S.stock.length === 0 && S.pending.length > 0;
  $('closingTitle').textContent = allRented ? '모든 무기를 빌려주었다' : '오늘의 접객이 끝났다';
  $('closingDesc').textContent = allRented
    ? '선반이 비었다. 오늘 장사는 여기까지다. 문을 닫고 빌려준 무기들이 향하는 곳을 확인한다.'
    : '더 기다리는 용사가 없다. 문을 닫고 오늘 길에 오를 이들을 확인한다.';
  $('closingCount').textContent = S.pending.length;
  const btn = $('closeShopBtn');
  btn.disabled = false;
  btn.textContent = '문을 닫고 던전 지도를 본다';

  const screen = $('closing');
  screen.classList.remove('leaving');
  requestAnimationFrame(()=>screen.classList.add('on'));
}

function beginNightMap(){
  const screen = $('closing');
  const btn = $('closeShopBtn');
  if(!screen.classList.contains('on') || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '지도를 펼치는 중…';
  screen.classList.add('leaving');

  renderMap();
  scrollToShop(false);
  setTimeout(()=>{
    screen.classList.remove('on');
    runSequence();
    setTimeout(()=>{
      screen.classList.remove('leaving');
      closingShown = false;
    }, 420);
  }, 620);
}

function nextHero(){
  $('talk').classList.remove('show');
  G.idx++; G.cursor=0; G.locked=false;
  if(!S.stock.length && S.pending.length){
    showClosingScreen();
    return;
  }
  renderHero();
  if(G.idx < G.heroes.length) renderRail(0);
}

function endGreet(){
  showClosingScreen();
}

/* ═══════════ [§scr.ldrawer] 지도 하단 대여 카드 영역 ═══════════
   지도를 여는 목적 자체가 이 목록을 보는 것이다 — 기본값으로 펼쳐진다.
   카드를 누르면 그 토큰이 있는 높이로 지도가 움직인다.
   목록과 지도가 같은 것을 가리키게 만든다.               */
function renderLoansDrawer(){
  const n = S.out.length + S.pending.length;
  $('ldrawerCount').textContent = n ? `${n}자루` : '';

  const pend = S.pending.map(p => loanCardHTML({
    hero:p.hero, weapon:p.weapon, said:p.said, state:'pending'
  }, { map:true }));
  const out = S.out.slice().sort((a,b)=>
    (DUNGEONS[a.dungeon].turns - a.elapsed) - (DUNGEONS[b.dungeon].turns - b.elapsed)
  ).map(o => loanCardHTML({
    id:o.id, hero:o.hero, weapon:o.weapon, said:o.said, state:'out',
    dungeon:o.dungeon, left:DUNGEONS[o.dungeon].turns - o.elapsed, ago:S.day - o.dispatchDay
  }, { map:true }));

  $('ldrawerBody').innerHTML = n ? `
    <section class="loans__group">
      <div class="loans__k">대여 카드 · 좌우로 넘겨 본다</div>
      <div class="loans__rail">${pend.join('')}${out.join('')}</div>
    </section>
  ` : `<div class="loans__none">지금 나가 있는 것이 없다.</div>`;

  $('ldrawerBody').querySelectorAll('.loan-card[data-tok]').forEach(card=>{
    card.onclick = ()=>{
      const o = S.out.find(x=>x.id === card.dataset.tok);
      if(!o) return;
      scrollToY(tokenY(o) + 16);
      const t = document.getElementById('tok-'+o.id);
      if(t){ t.classList.remove('ping'); void t.offsetWidth; t.classList.add('ping'); }
    };
  });
}
function toggleDrawer(force){

}
